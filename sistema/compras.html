async function toBlob(file){

  for(const q of [.82,.7,.55]){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b&&b.size<=1900*1024)return b}
  throw new Error('grande');

}

}
async function del(id){
 const r=ROWS.find(x=>x.id===id);if(!r||!confirm(`Excluir “${r.title}”? Isso não pode ser desfeito.`))return;
 const {error}=await CTX.client.from('boha_requests').delete().eq('id',id);if(error){toast('Não foi possível excluir.');return}
 if(r.photo)CTX.client.storage.from('boha-compras').remove([id+'.jpg']).catch(()=>{});
 ROWS=ROWS.filter(x=>x.id!==id);closeDrawer();render();toast('Pedido excluído.');
}
function exportCsv(){
 const list=visible().sort(byPrio);if(!list.length){toast('Nada para exportar com este filtro.');return}
 const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"',n=v=>v==null?'':String(v).replace('.',',');
 const lines=[['Unidade','Área','Tipo','Item','Prioridade','Andamento','Quantidade','Valor unitário','Total','Link','Aberto em','Detalhes'].map(c).join(';')];
 list.forEach(r=>lines.push([UNITS[r.unit].name,r.area,KIND[r.kind],r.title,PRIO[r.priority].l,STATUS[r.kind][r.status],r.qty,n(r.price),n(total(r)),r.link||'',new Date(r.created_at).toLocaleDateString('pt-BR'),r.notes].map((v,i)=>i===6?v:c(v)).join(';')));
 const url=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='boha-compras-manutencao.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Lista exportada.');
}
function openDrawer(){lastFocus=document.activeElement;$('overlay').classList.add('open');document.body.style.overflow='hidden'}
function closeDrawer(){$('overlay').classList.remove('open');document.body.style.overflow='';if(PH.blob&&PH.url)URL.revokeObjectURL(PH.url);EDIT=null;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-unit],[data-area],[data-add-area],[data-status],[data-kind],[data-view],[data-open],[data-step],[data-reset],[data-urg],#btnNew,#btnCsv,#drClose,#btnCancel,#btnDel,#dz,#photoChange,#photoRemove,[data-k],[data-p],[data-s]');if(!t)return;
 if(t.dataset.unit){S.unit=t.dataset.unit;S.area='all';S.kind='all';S.status='open';S.q='';render();window.scrollTo({top:0})}
 else if(t.hasAttribute('data-area')){S.area=t.dataset.area;S.kind='all';S.status='all';S.q='';S.view='prio';render();window.scrollTo({top:0})}
 else if(t.dataset.addArea){openForm(null)}
 else if(t.dataset.status){S.status=t.dataset.status;render()}
 else if(t.dataset.kind){S.kind=t.dataset.kind;render()}
 else if(t.dataset.view){S.view=t.dataset.view;render()}
 else if(t.dataset.open){openForm(ROWS.find(r=>r.id===t.dataset.open))}
 else if(t.dataset.step){const r=ROWS.find(x=>x.id===t.dataset.step);if(r)setStatus(r.id,STEP[r.kind][r.status][0])}
 else if(t.dataset.reset){S.status='open';S.kind='all';S.area='all';S.q='';render()}
 else if(t.dataset.urg){S.status='open';S.view='prio';render();const s=document.querySelector('.sec');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(t.id==='btnNew')openForm(null);
 else if(t.id==='btnCsv')exportCsv();
 else if(t.id==='drClose'||t.id==='btnCancel')closeDrawer();
 else if(t.id==='btnDel')del(EDIT.id);
 else if(t.id==='dz'||t.id==='photoChange'){if(canEdit())$('photoIn').click()}
 else if(t.id==='photoRemove'){if(PH.blob&&PH.url)URL.revokeObjectURL(PH.url);PH={blob:null,remove:true,url:null};updPhoto()}
 else if(t.dataset.k){EDIT.kind=t.dataset.k;document.querySelectorAll('#pKind button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===EDIT.kind));$('fTitle').previousElementSibling.textContent=EDIT.kind==='compra'?'O que precisa comprar?':'O que precisa consertar?';$('fTitle').placeholder=EDIT.kind==='compra'?'Ex.: Anilha de 10 kg (par)':'Ex.: Esteira 3 parando durante o uso';document.querySelectorAll('#pStat button').forEach(b=>b.textContent=STATUS[EDIT.kind][b.dataset.s])}
 else if(t.dataset.p){EDIT.priority=t.dataset.p;document.querySelectorAll('#pPrio button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===EDIT.priority))}
 else if(t.dataset.s){EDIT.status=t.dataset.s;document.querySelectorAll('#pStat button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===EDIT.status))}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='selArea'){S.area=t.value;render()}
 else if(t.dataset&&t.dataset.prio){const r=ROWS.find(x=>x.id===t.dataset.prio),prev=r.priority;r.priority=t.value;const {error}=await CTX.client.from('boha_requests').update({priority:t.value}).eq('id',r.id);if(error){r.priority=prev;toast('Não foi possível mudar a prioridade.')}else toast(`Prioridade: ${PRIO[t.value].l}.`);render()}
 else if(t.id==='fUnit'){EDIT.area='';fillAreas();$('newAreaBox').hidden=true}
 else if(t.id==='fArea'){$('newAreaBox').hidden=t.value!=='__new';if(t.value==='__new')$('fNewArea').focus()}
 else if(t.id==='photoIn'){pickPhoto(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;clearTimeout(input.t);input.t=setTimeout(render,180)}
 else if(e.target.id==='fQty'||e.target.id==='fPrice')updTotal();
});
function input(){}
document.addEventListener('submit',e=>{if(e.target.id==='form')saveForm(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open'))closeDrawer();if((e.key==='Enter'||e.key===' ')&&e.target.id==='dz'){e.preventDefault();if(canEdit())$('photoIn').click()}});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeDrawer()});
document.addEventListener('dragover',e=>{const d=$('dz');if(d&&e.target.closest('#dz')&&canEdit()){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',()=>{const d=$('dz');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=$('dz');if(d&&e.target.closest('#dz')&&canEdit()){e.preventDefault();d.classList.remove('over');pickPhoto(e.dataTransfer.files[0])}});
window.bohaReload=()=>{if(!EDIT)load().catch(()=>{})};
setInterval(()=>{if(!document.hidden&&!EDIT)load().catch(()=>{})},120000);
(async()=>{
 if(!CTX||!CTX.client){$('page').innerHTML='<div class="state">Abra este módulo pelo <a href="../equipe.html#compras" style="color:var(--y)">sistema interno da Boha</a>.</div>';return}
 ROLE=(CTX.profile&&CTX.profile.role)||'viewer';
 try{await load()}catch{$('page').innerHTML='<div class="state">Não foi possível carregar os pedidos. Atualize a página.</div>'}
})();
</script></body></html>
