<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Avaliação dos professores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--bg:#0a0a0a;--panel:#141414;--line:#242424;--line2:#333;--text:#f2f2f2;--muted:#9b9b9b;--y:#fff000;--good:#3ddc84;--bad:#ff5a4f;--warn:#ff9f2e;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bg)}body{margin:0;color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;text-align:left}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--y);outline-offset:2px}[hidden]{display:none!important}
.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}.page{max-width:1200px;margin:0 auto;padding:25px 28px 80px}.eyebrow{display:flex;align-items:center;gap:10px;margin:0;color:var(--y);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.eyebrow:before{content:'';width:22px;height:2px;background:var(--y)}
.hd{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap}.hd h1{font-size:clamp(34px,4.6vw,54px);line-height:1;margin:12px 0 7px}.hd p:last-child{margin:0;color:var(--muted);font-size:14px}.source{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:7px 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:26px 0 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1;min-width:150px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:13px;padding:13px 15px;font-weight:700;white-space:nowrap}.tabs button:hover{border-color:#777}.tabs button[aria-pressed="true"]{border-color:var(--y);background:#22220e}.tabs small{font-size:11px;color:var(--muted);font-weight:700}.tabs button[aria-pressed="true"] small{color:var(--y)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.kpi span{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.kpi b{display:block;font-size:29px;line-height:1.15;margin-top:4px}.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.panel-head h2{font-size:26px;line-height:1;margin:0}.panel-head p{margin:0;color:var(--muted);font-size:12.5px}.dist{display:flex;height:16px;overflow:hidden;border-radius:999px;background:#222;margin-top:18px}.dist span{height:100%;min-width:0}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px}.legend span{display:inline-flex;align-items:center;gap:6px;color:#cfcfcf;font-size:12px}.legend i{width:8px;height:8px;border-radius:50%;display:block}.legend b{color:var(--text)}
.unit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.unit-card{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;transition:border-color .2s,transform .2s var(--ease)}.unit-card:hover{border-color:rgba(255,240,0,.6);transform:translateY(-2px)}.unit-card h3{font-size:23px;margin:0;line-height:1}.unit-card .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin:10px 0}.unit-card strong{color:var(--y);font-size:24px}.unit-card .dist{height:7px;margin-top:11px}.unit-card .link{display:block;text-align:right;color:var(--y);font-size:12px;font-weight:700;margin-top:11px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:30px 0 12px}.section-head h2{font-size:28px;margin:0;line-height:1}.section-head p{color:var(--muted);margin:4px 0 0;font-size:12.5px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inp{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;min-width:0;font-size:13px;outline:none}.inp:focus{border-color:var(--y)}.tools input{width:225px}.tools select{max-width:180px}.min-toggle{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;white-space:nowrap}.min-toggle input{accent-color:var(--y)}
.teacher-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.teacher{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;transition:border-color .2s,transform .2s var(--ease);text-align:left}.teacher:hover{border-color:rgba(255,240,0,.55);transform:translateY(-2px)}.teacher-top{display:flex;align-items:start;justify-content:space-between;gap:8px}.teacher h3{font-size:19px;margin:0;line-height:1.2;overflow-wrap:anywhere}.teacher .unit{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:4px 8px;white-space:nowrap}.teacher .n{font-size:12px;color:var(--muted);margin-top:5px}.teacher-main{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:19px}.teacher-main b{font-size:29px;line-height:1;color:var(--y)}.teacher-main small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.teacher-main .mean{text-align:right}.teacher-main .mean b{font-size:20px;color:var(--text)}.teacher .dist{height:8px;margin:14px 0 0}.teacher-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:16px;color:var(--muted);font-size:11.5px}.teacher-foot strong{color:var(--y);font-size:12px}.empty{padding:38px 20px;border:1px dashed var(--line2);border-radius:16px;color:var(--muted);text-align:center}.note{color:var(--muted);font-size:12px;line-height:1.5;margin:18px 0 0}
.avatar-photo{width:44px;height:44px;flex:none;border-radius:12px;object-fit:cover;background:#303030;border:1px solid #444}.avatar-fallback{display:grid;place-items:center;color:var(--y);font-family:Anton,Impact,sans-serif;font-size:23px}.teacher-name{display:flex;gap:11px;align-items:center;min-width:0}.teacher-name>span:last-child{min-width:0}.podiums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.podium{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px}.podium h3{font-size:23px;line-height:1;margin:0 0 13px}.podium-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;color:var(--text)}.podium-row:hover .who b{color:var(--y)}.podium-row .place{font-family:Anton,Impact,sans-serif;font-size:25px;color:var(--y);min-width:34px}.podium-row .avatar-photo{width:37px;height:37px;border-radius:10px}.podium-row .avatar-fallback{font-size:18px}.podium-row .who{flex:1;min-width:0}.podium-row .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.podium-row .who small{display:block;color:var(--muted);font-size:11px}.podium-row strong{font-size:17px;color:var(--y)}.photo-box{display:flex;align-items:center;gap:15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;margin:22px 0}.photo-box .avatar-photo{width:72px;height:72px;border-radius:16px}.photo-box .avatar-fallback{font-size:35px}.photo-box .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.photo-box button{border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700}.photo-box button:hover{border-color:var(--y);color:var(--y)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}.overlay.open{opacity:1;visibility:visible;transition:opacity .2s}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(540px,100%);background:#111;border-left:1px solid var(--line2);padding:25px 25px 40px;overflow:auto;transform:translateX(25px);transition:transform .25s var(--ease)}.overlay.open .drawer{transform:none}.drawer-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.drawer h2{font-size:31px;line-height:1;margin:8px 0 2px}.drawer .sub{font-size:13px;color:var(--muted);margin:0}.x{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:50%;flex:none}.x:hover{border-color:var(--y);color:var(--y)}.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:23px 0}.detail-stats div{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.detail-stats small{display:block;color:var(--muted);font-size:11px}.detail-stats b{display:block;font-size:22px}.detail-row{margin-top:13px}.detail-row .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}.detail-row .top b{font-size:14px}.detail-row .track{height:8px;background:#222;border-radius:99px;overflow:hidden;margin-top:6px}.detail-row .track span{height:100%;display:block;border-radius:99px}.detail-note{border-top:1px solid var(--line);padding-top:14px;margin-top:24px;font-size:12px;color:var(--muted);line-height:1.55}
@media(max-width:950px){.kpis{grid-template-columns:repeat(2,1fr)}.teacher-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.page{padding:17px 16px 70px}.hd h1{font-size:36px}.tabs button{min-width:135px}.unit-grid,.teacher-grid,.podiums{grid-template-columns:1fr}.tools{width:100%}.tools input{flex:1;min-width:150px}.tools select{flex:1}.section-head{align-items:start}.drawer{padding:18px 16px 35px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body>
<div class="page" id="page"><div class="empty">Carregando avaliações…</div></div>
<div class="overlay" id="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1"><div id="drawerBody"></div></section></div>
<input type="file" id="teacherPhoto" accept="image/*" hidden>
<dialog id="ratingDialog" style="width:min(520px,calc(100% - 24px));border:1px solid #444;border-radius:16px;background:#121212;color:#f4f4f4;padding:20px"><form id="ratingForm"><h2 class="display">Registrar avaliação do mês</h2><label>Mês <input class="inp" type="month" id="ratingMonth" value="2026-11" required></label><label>Professor <select class="inp" id="ratingEmployee" required></select></label><div class="detail-stats"><label style="display:grid;gap:4px"><small>Péssimo</small><input class="inp" type="number" min="0" step="1" value="0" data-rating="pessimo"></label><label style="display:grid;gap:4px"><small>Ruim</small><input class="inp" type="number" min="0" step="1" value="0" data-rating="ruim"></label><label style="display:grid;gap:4px"><small>Regular</small><input class="inp" type="number" min="0" step="1" value="0" data-rating="regular"></label><label style="display:grid;gap:4px"><small>Bom</small><input class="inp" type="number" min="0" step="1" value="0" data-rating="bom"></label><label style="display:grid;gap:4px"><small>Ótimo</small><input class="inp" type="number" min="0" step="1" value="0" data-rating="otimo"></label></div><div class="actions" style="display:flex;justify-content:flex-end;gap:8px"><button class="btn-g" type="button" id="ratingCancel">Cancelar</button><button class="btn-y" type="submit">Salvar resultados</button></div></form></dialog>
<script>
'use strict';
let CTX=null;try{CTX=(window.parent!==window&&window.parent.bohaCtx)||window.bohaCtx||null}catch{}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UNIT={cb:'Casa Branca',te:'Santa Tereza',ma:'Macedônia'},CATS=[['pessimo','Péssimo','#ff5a4f'],['ruim','Ruim','#ff9f2e'],['regular','Regular','#8b9099'],['bom','Bom','#6f9bff'],['otimo','Ótimo','#3ddc84']];
let ROWS=[],EMPLOYEES=[],S={unit:'all',month:'2026-11',search:'',sort:'responses',min10:false},focusBefore=null,PHOTO_URLS={},photoTarget=null;
const count=r=>CATS.reduce((n,[k])=>n+Number(r[k]||0),0),positive=r=>Number(r.bom||0)+Number(r.otimo||0),rate=r=>count(r)?positive(r)/count(r):0,mean=r=>count(r)?CATS.reduce((n,[k],i)=>n+Number(r[k]||0)*(i+1),0)/count(r):0;
const pct=v=>Math.round(v*100)+'%',dec=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
function sum(rows){const r={pessimo:0,ruim:0,regular:0,bom:0,otimo:0};rows.forEach(x=>CATS.forEach(([k])=>r[k]+=Number(x[k]||0)));return r}
function dist(r){const n=count(r);return `<div class="dist" role="img" aria-label="${CATS.map(([k,l])=>`${l}: ${Number(r[k]||0)}`).join(', ')}">${CATS.map(([k,l,c])=>`<span title="${l}: ${Number(r[k]||0)}" style="width:${n?Number(r[k]||0)/n*100:0}%;background:${c}"></span>`).join('')}</div>`}
function legend(r){return `<div class="legend">${CATS.map(([k,l,c])=>`<span><i style="background:${c}"></i>${l} <b>${Number(r[k]||0)}</b></span>`).join('')}</div>`}
const avatar=r=>PHOTO_URLS[r.id]?`<img class="avatar-photo" src="${esc(PHOTO_URLS[r.id])}" alt="Foto de ${esc(r.professor)}">`:`<span class="avatar-photo avatar-fallback" aria-hidden="true">${esc(r.professor.charAt(0))}</span>`;
const normalizeName=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLocaleLowerCase('pt-BR');
const employeeFor=r=>EMPLOYEES.find(e=>e.id===r.employee_id)||EMPLOYEES.find(e=>e.unit===r.unit&&normalizeName(e.name)===normalizeName(r.professor));
const ranked=rows=>rows.slice().sort((a,b)=>count(b)-count(a)||Number(b.otimo||0)-Number(a.otimo||0)||a.professor.localeCompare(b.professor,'pt-BR')).slice(0,3);
function podium(title,rows){const top=ranked(rows);return `<section class="podium"><h3 class="display">${title}</h3>${top.map((r,i)=>`<button class="podium-row" data-id="${r.id}" aria-label="${i+1}º lugar: ${esc(r.professor)}, ${count(r)} respostas, ${Number(r.otimo||0)} ótimo"><span class="place">${i+1}º</span>${avatar(r)}<span class="who"><b>${esc(r.professor)}</b><small>${UNIT[r.unit]} · ${count(r)} respostas · ${Number(r.otimo||0)} ótimo</small></span><strong>${count(r)}</strong></button>`).join('')}</section>`}
function sorted(rows){const q=S.search.trim().toLocaleLowerCase('pt-BR');return rows.filter(r=>(S.unit==='all'||r.unit===S.unit)&&(!q||r.professor.toLocaleLowerCase('pt-BR').includes(q))&&(!S.min10||count(r)>=10)).sort((a,b)=>S.sort==='name'?a.professor.localeCompare(b.professor,'pt-BR'):S.sort==='favorable'?rate(b)-rate(a)||count(b)-count(a):S.sort==='mean'?mean(b)-mean(a)||count(b)-count(a):count(b)-count(a)||a.professor.localeCompare(b.professor,'pt-BR'))}
function render(){
 const monthRows=ROWS.filter(r=>String(r.survey_month||'').slice(0,7)===S.month),scope=S.unit==='all'?monthRows:monthRows.filter(r=>r.unit===S.unit),agg=sum(scope),n=count(agg),list=sorted(monthRows),savedSearch=S.search,wasSearch=document.activeElement?.id==='search';
 let h=`<header class="hd"><div><p class="eyebrow">Gestão · avaliação dos alunos</p><h1 class="display">Qualidade dos professores</h1><p>Veja como os alunos avaliaram os professores de cada unidade.</p></div><span class="source">Acesso só para administradores</span>${CTX.profile?.role==="admin"?'<button class="btn-y" type="button" data-add-rating>+ Registrar mês</button>':''}</header>
 <div class="tools" style="margin-top:14px"><label for="surveyMonth">Pesquisa do mês</label><input class="inp" id="surveyMonth" type="month" value="${S.month}"></div><nav class="tabs" aria-label="Filtrar por unidade">${[['all','Todas'],...Object.entries(UNIT)].map(([k,l])=>`<button type="button" data-unit="${k}" aria-pressed="${S.unit===k}"><span>${l}</span><small>${(k==='all'?monthRows:monthRows.filter(r=>r.unit===k)).length} professores</small></button>`).join('')}</nav>
 <section class="kpis" aria-label="Resumo"><div class="kpi"><span>Respostas dos alunos</span><b>${n}</b><small>${S.unit==='all'?'Nas 3 unidades':UNIT[S.unit]} · ${S.month}</small></div><div class="kpi"><span>Bom + ótimo</span><b>${pct(rate(agg))}</b><small>${positive(agg)} de ${n} respostas</small></div><div class="kpi"><span>Média das respostas</span><b>${dec(mean(agg))} / 5</b><small>Escala de péssimo a ótimo</small></div><div class="kpi"><span>Professores avaliados</span><b>${scope.length}</b><small>Com respostas no relatório</small></div></section>
 <section class="panel"><div class="panel-head"><h2 class="display">Distribuição das respostas</h2><p>${S.unit==='all'?'Todas as unidades':UNIT[S.unit]} · ${n} respostas</p></div>${dist(agg)}${legend(agg)}</section>`;
 if(S.unit==='all')h+=`<section class="unit-grid" aria-label="Comparar unidades">${Object.entries(UNIT).map(([k,l])=>{const rr=monthRows.filter(r=>r.unit===k),a=sum(rr);return `<button class="unit-card" data-unit="${k}"><h3 class="display">${l}</h3><div class="meta"><span>${rr.length} professores</span><span>${count(a)} respostas</span></div><strong>${pct(rate(a))}</strong><span class="meta">Bom + ótimo</span>${dist(a)}<span class="link">Ver professores →</span></button>`}).join('')}</section>`;
 h+=`<div class="section-head"><div><h2 class="display">Funcionário do mês · ${S.month}</h2><p>Mais respostas primeiro; em caso de empate, maior número de respostas “ótimo”.</p></div></div><div class="podiums">${podium('Geral · 3 unidades',monthRows)}${(S.unit==='all'?Object.entries(UNIT):[[S.unit,UNIT[S.unit]]]).map(([k,l])=>podium(l,monthRows.filter(r=>r.unit===k))).join('')}</div>`;
 h+=`<div class="section-head"><div><h2 class="display">Professores avaliados</h2><p>Percentuais sempre acompanhados do número de respostas.</p></div><div class="tools"><input class="inp" id="search" type="search" placeholder="Buscar professor…" aria-label="Buscar professor" value="${esc(savedSearch)}"><select class="inp" id="sort" aria-label="Organizar professores"><option value="responses" ${S.sort==='responses'?'selected':''}>Mais respostas</option><option value="favorable" ${S.sort==='favorable'?'selected':''}>Mais favoráveis</option><option value="mean" ${S.sort==='mean'?'selected':''}>Maior média</option><option value="name" ${S.sort==='name'?'selected':''}>Nome A–Z</option></select><label class="min-toggle"><input id="min10" type="checkbox" ${S.min10?'checked':''}>10+ respostas</label></div></div><p class="note" style="margin:0 0 12px">${list.length} professor${list.length===1?'':'es'} exibido${list.length===1?'':'s'}</p>`;
 h+=list.length?`<div class="teacher-grid">${list.map(r=>`<button class="teacher" data-id="${r.id}" aria-label="Ver avaliação de ${esc(r.professor)}"><span class="teacher-top"><span class="teacher-name">${avatar(r)}<span><h3>${esc(r.professor)}</h3><span class="n">${count(r)} respostas</span></span></span><span class="unit">${UNIT[r.unit]}</span></span><span class="teacher-main"><span><b>${pct(rate(r))}</b><small>Bom + ótimo</small></span><span class="mean"><b>${dec(mean(r))} / 5</b><small>Média</small></span></span>${dist(r)}<span class="teacher-foot"><span>${Number(r.otimo)} ótimo${Number(r.otimo)===1?'':'s'} · ${Number(r.bom)} ${Number(r.bom)===1?'bom':'bons'}</span><strong>Ver detalhes →</strong></span></button>`).join('')}</div>`:`<div class="empty">Nenhum professor corresponde aos filtros escolhidos.</div>`;
 h+=`<p class="note">Fonte: três relatórios de avaliação fornecidos pela gestão. Os PDFs não informam a data da coleta. Campos em branco foram representados por zero nos relatórios.</p>`;
 $('page').innerHTML=h;if(wasSearch){$('search').focus();$('search').setSelectionRange(savedSearch.length,savedSearch.length)}
}
function openDetail(id){const r=ROWS.find(x=>x.id===id);if(!r)return;photoTarget=id;focusBefore=document.activeElement;const n=count(r);
 $('drawerBody').innerHTML=`<div class="drawer-head"><div><p class="eyebrow">${UNIT[r.unit]}</p><h2 class="display" id="drawerTitle">${esc(r.professor)}</h2><p class="sub">Avaliação da qualidade · ${n} respostas</p></div><button class="x" id="closeDetail" aria-label="Fechar detalhes">✕</button></div><div class="photo-box">${avatar(r)}<div><b>Foto do professor</b><div class="actions"><button type="button" data-photo="choose">${r.photo?'Trocar foto':'Adicionar foto'}</button>${r.photo?'<button type="button" data-photo="remove">Remover foto</button>':''}</div></div></div><div class="detail-stats"><div><small>Bom + ótimo</small><b>${pct(rate(r))}</b></div><div><small>Média</small><b>${dec(mean(r))}/5</b></div><div><small>Respostas</small><b>${n}</b></div></div><h3 class="display" style="font-size:22px;margin:0">Respostas por categoria</h3>${CATS.map(([k,l,c])=>`<div class="detail-row"><div class="top"><span>${l}</span><b>${Number(r[k]||0)} · ${pct(n?Number(r[k]||0)/n:0)}</b></div><div class="track"><span style="width:${n?Number(r[k]||0)/n*100:0}%;background:${c}"></span></div></div>`).join('')}<p class="detail-note">Os percentuais usam as respostas deste professor. Considere também a quantidade de respostas ao comparar pessoas. O relatório de origem não informa a data da pesquisa.</p>`;
 if(CTX.profile?.role!=='admin')$('drawerBody').querySelectorAll('[data-photo]').forEach(b=>b.remove());
 $('overlay').classList.add('open');document.body.style.overflow='hidden';$('closeDetail').focus()}
function closeDetail(){$('overlay').classList.remove('open');document.body.style.overflow='';if(focusBefore?.isConnected)focusBefore.focus()}
document.addEventListener('click',e=>{if(e.target.closest('[data-add-rating]')){if(CTX.profile?.role!=='admin')return;$('ratingMonth').value=S.month;$('ratingEmployee').innerHTML='<option value="">Escolha o funcionário</option>'+EMPLOYEES.map(p=>`<option value="${p.id}">${esc(p.name)} · ${UNIT[p.unit]}</option>`).join('');document.querySelectorAll('[data-rating]').forEach(x=>x.value='0');$('ratingDialog').showModal()}else if(e.target.id==='ratingCancel')$('ratingDialog').close()});
$('ratingForm').addEventListener('submit',async e=>{e.preventDefault();if(CTX.profile?.role!=='admin')return;const employee=EMPLOYEES.find(p=>p.id===$('ratingEmployee').value);if(!employee){alert('Escolha um funcionário.');return}const numbers=Object.fromEntries([...document.querySelectorAll('[data-rating]')].map(x=>[x.dataset.rating,Math.max(0,Number(x.value)||0)]));if(Object.values(numbers).reduce((a,b)=>a+b,0)<1){alert('Informe ao menos uma resposta.');return}const surveyMonth=$('ratingMonth').value+'-01',row={unit:employee.unit,professor:employee.name,employee_id:employee.id,survey_month:surveyMonth,...numbers};const {data,error}=await CTX.client.from('boha_professor_ratings').upsert(row,{onConflict:'unit,professor,survey_month'}).select().single();if(error){alert('Não foi possível salvar os dados deste mês.');return}const index=ROWS.findIndex(x=>x.unit===data.unit&&x.professor===data.professor&&x.survey_month===data.survey_month);if(index<0)ROWS.push(data);else ROWS[index]=data;S.month=surveyMonth.slice(0,7);$('ratingDialog').close();render()});
async function makeJpeg(file){const bitmap=await createImageBitmap(file),scale=Math.min(1,800/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.82));if(blob?.size>1900000)blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.65));if(!blob||blob.size>2097152)throw Error('Imagem muito grande');return blob}
async function savePhoto(file){const r=ROWS.find(x=>x.id===photoTarget);if(!r||!file)return;if(!file.type.startsWith('image/')){alert('Escolha uma imagem.');return}try{const blob=await makeJpeg(file),up=await CTX.client.storage.from('boha-professores').upload(r.id+'.jpg',blob,{upsert:true,contentType:'image/jpeg'});if(up.error)throw up.error;const {error}=await CTX.client.from('boha_professor_ratings').update({photo:true}).eq('id',r.id);if(error)throw error;r.photo=true;if(PHOTO_URLS[r.id]?.startsWith('blob:'))URL.revokeObjectURL(PHOTO_URLS[r.id]);PHOTO_URLS[r.id]=URL.createObjectURL(blob);render();openDetail(r.id)}catch{alert('Não foi possível salvar a foto. Tente outra imagem.')}}
async function removePhoto(){const r=ROWS.find(x=>x.id===photoTarget);if(!r||!r.photo)return;const out=await CTX.client.storage.from('boha-professores').remove([r.id+'.jpg']);if(out.error){alert('Não foi possível remover a foto.');return}const {error}=await CTX.client.from('boha_professor_ratings').update({photo:false}).eq('id',r.id);if(error){alert('Não foi possível atualizar a foto.');return}r.photo=false;if(PHOTO_URLS[r.id]?.startsWith('blob:'))URL.revokeObjectURL(PHOTO_URLS[r.id]);delete PHOTO_URLS[r.id];render();openDetail(r.id)}
document.addEventListener('click',e=>{const p=e.target.closest('[data-photo]'),u=e.target.closest('[data-unit]'),t=e.target.closest('[data-id]');if(p){if(p.dataset.photo==='choose')$('teacherPhoto').click();else removePhoto()}else if(u){S.unit=u.dataset.unit;render();window.scrollTo(0,0)}else if(t)openDetail(t.dataset.id);else if(e.target.closest('#closeDetail')||e.target.id==='overlay')closeDetail()});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;clearTimeout(render.timer);render.timer=setTimeout(render,120)}});
document.addEventListener('change',e=>{if(e.target.id==='surveyMonth'){S.month=e.target.value||'2026-11';render()}else if(e.target.id==='sort'){S.sort=e.target.value;render()}else if(e.target.id==='min10'){S.min10=e.target.checked;render()}else if(e.target.id==='teacherPhoto'){savePhoto(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open'))closeDetail()});
(async()=>{if(!CTX?.client||!CTX.canModule?.('qualidade')){$('page').innerHTML='<div class="empty">Este painel não está liberado para o seu perfil.</div>';return}try{const [ratings,people]=await Promise.all([CTX.client.from('boha_professor_ratings').select('id,unit,professor,pessimo,ruim,regular,bom,otimo,photo,employee_id,survey_month').order('professor'),CTX.loadEmployees?CTX.loadEmployees().catch(()=>[]):Promise.resolve([])]);if(ratings.error)throw ratings.error;ROWS=ratings.data||[];EMPLOYEES=people||[];render();await Promise.all(ROWS.map(async r=>{if(r.photo){const {data}=await CTX.client.storage.from('boha-professores').createSignedUrl(r.id+'.jpg',3600);if(data?.signedUrl)PHOTO_URLS[r.id]=data.signedUrl}else{const person=employeeFor(r);if(person?.photo_path){const {data}=await CTX.client.storage.from('boha-employees').createSignedUrl(person.photo_path,3600);if(data?.signedUrl)PHOTO_URLS[r.id]=data.signedUrl}}}));render()}catch{$('page').innerHTML='<div class="empty">Não foi possível carregar as avaliações. Atualize a página.</div>'}})();
</script></body></html>
