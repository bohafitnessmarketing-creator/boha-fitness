<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Pesquisa de clima</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--bg:#0a0a0a;--panel:#151515;--line:#2d2d2d;--muted:#a2a2a2;--text:#f3f3f3;--y:#fff000;--green:#42d392;--orange:#ffb454;--red:#ff7068}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--y);outline-offset:2px}[hidden]{display:none!important}.page{max-width:1200px;margin:auto;padding:26px 23px 70px}.eyebrow{color:var(--y);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;margin:0}.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}h1{font-size:clamp(34px,5vw,53px);line-height:1;margin:8px 0}.sub{color:var(--muted);margin:0}.head{display:flex;align-items:end;justify-content:space-between;gap:15px}.stamp{border:1px solid #494500;color:var(--y);border-radius:99px;padding:8px 13px;font-size:12px;font-weight:800}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 13px}.field{background:#191919;border:1px solid #414141;border-radius:9px;padding:9px 11px;min-width:160px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.kpi small{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.kpi b{display:block;font-size:28px;margin:3px 0}.kpi span{font-size:11px;color:var(--muted)}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.unit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.unit b{font-size:20px}.unit span{display:block;color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px}.panel h2{font-size:23px;margin:0 0 12px}.dist{display:grid;gap:10px}.qrow{display:grid;grid-template-columns:minmax(160px,1fr) 2fr 55px;align-items:center;gap:9px}.qrow label{font-size:12px;color:#ddd}.track{height:11px;background:#252525;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--y);border-radius:99px}.qrow strong{text-align:right;font-size:12px}.legend{color:var(--muted);font-size:11px;margin-top:12px}.comments{display:grid;gap:9px}.comment{border:1px solid #303030;border-left:3px solid #5d5700;border-radius:10px;background:#101010;padding:11px}.comment h3{font-size:12px;color:var(--y);margin:0 0 6px}.comment p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.comment small{display:block;margin-top:7px;color:var(--muted)}.empty{border:1px dashed #444;border-radius:12px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}.notice{border:1px solid #3e3820;background:#17150d;color:#c9c3a8;border-radius:10px;padding:11px 13px;font-size:11px;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1c;border:1px solid #444;border-radius:10px;padding:10px 14px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.page{padding:19px 14px 50px}.head{align-items:start;flex-direction:column}.filters>*{flex:1;min-width:130px}.units{grid-template-columns:1fr}.qrow{grid-template-columns:1fr 1fr 42px;gap:7px}.qrow label{grid-column:1/-1}.kpi{padding:11px}}
</style></head><body><main class="page" id="app"><div class="empty">Carregando pesquisa…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';let CTX=null;try{CTX=window.parent.bohaCtx||null}catch{};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const UNITS={all:'Todas as unidades',cb:'Casa Branca',te:'Santa Tereza',ma:'Macedônia'};const QUESTIONS=[['ambiente','Como você avalia o ambiente de trabalho no dia a dia?'],['escuta_gestao','Você sente que suas ideias são ouvidas pela gestão?'],['comunicacao','A comunicação entre equipe/unidades funciona bem?']];const OPEN=[['materiais','Equipamentos e materiais'],['estrutura','Estrutura física'],['pontos_fortes','O que a Boha faz bem e não pode perder?'],['espaco_fala','Tem algo que gostaria de falar mas nunca teve espaço?'],['mudaria','O que mudaria hoje na Boha?']];let ROWS=[],unit='all',role='all';const monthLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),escUnit=u=>UNITS[u]||u;function avg(rows){const vals=rows.map(r=>Number(r.answers?.satisfacao)).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}function countChoice(rows,key){const m=new Map();rows.forEach(r=>{const v=String(r.answers?.[key]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});return [...m].sort((a,b)=>b[1]-a[1])}
function render(){const months=[...new Set(ROWS.map(r=>r.survey_month))].sort((a,b)=>b.localeCompare(a)),month=months[0]||'2026-09-01';const all=ROWS.filter(r=>r.survey_month===month&&(unit==='all'||r.unit===unit)&&(role==='all'||r.job_role===role)),roles=[...new Set(ROWS.filter(r=>r.survey_month===month).map(r=>r.job_role).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR')),sats=all.map(r=>Number(r.answers?.satisfacao)).filter(Number.isFinite),sAvg=avg(all),prom=sats.filter(x=>x>=9).length,low=sats.filter(x=>x<=6).length;const bars=key=>{const cats=countChoice(all,key),max=Math.max(1,...cats.map(x=>x[1]));return cats.length?cats.map(([v,n])=>`<div class="qrow"><label>${esc(v)}</label><div class="track"><i style="width:${n/max*100}%"></i></div><strong>${n} · ${all.length?Math.round(n*100/all.length):0}%</strong></div>`).join(''):'<div class="legend">Sem respostas</div>'};const unitcards=Object.entries(UNITS).filter(([k])=>k!=='all').map(([k,label])=>{const r=ROWS.filter(x=>x.survey_month===month&&x.unit===k);return `<article class="unit"><b>${r.length}</b><span>${label} · respostas</span><span>${avg(r)==null?'Satisfação não informada':'Média de satisfação '+avg(r).toFixed(1)+' / 10'}</span></article>`}).join('');const comments=OPEN.flatMap(([key,label])=>all.filter(r=>String(r.answers?.[key]||'').trim()).map(r=>({key,label,text:String(r.answers[key]).trim(),unit:r.unit,job:r.job_role})));$('app').innerHTML=`<header class="head"><div><p class="eyebrow">Equipe · pesquisa interna</p><h1 class="display">Pesquisa de clima</h1><p class="sub">Respostas agrupadas por período, unidade e função.</p></div><span class="stamp">${monthLabel(month)}</span></header><div class="filters"><select class="field" id="unitFilter">${Object.entries(UNITS).map(([k,v])=>`<option value="${k}" ${unit===k?'selected':''}>${v}</option>`).join('')}</select><select class="field" id="roleFilter"><option value="all">Todas as funções</option>${roles.map(x=>`<option value="${esc(x)}" ${role===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><section class="kpis"><article class="kpi"><small>Respostas</small><b>${all.length}</b><span>Pesquisa de setembro de 2026</span></article><article class="kpi"><small>Satisfação geral</small><b>${sAvg==null?'—':sAvg.toFixed(1)+' / 10'}</b><span>Média das notas informadas</span></article><article class="kpi"><small>Notas 9 e 10</small><b>${prom}</b><span>${sats.length?Math.round(prom*100/sats.length):0}% das notas válidas</span></article><article class="kpi"><small>Notas até 6</small><b>${low}</b><span>${sats.length?Math.round(low*100/sats.length):0}% das notas válidas</span></article></section><section class="units">${unitcards}</section><div class="layout"><section class="panel"><h2 class="display">Percepções da equipe</h2><div class="dist">${QUESTIONS.map(([key,label])=>`<div><p class="eyebrow" style="letter-spacing:.04em;margin:12px 0 7px;color:#ddd">${esc(label)}</p><div class="dist">${bars(key)}</div></div>`).join('')}</div><div class="legend">As barras comparam a frequência de cada resposta nesta seleção.</div></section><section class="panel"><h2 class="display">Satisfação geral</h2>${(()=>{const freqs=Array.from({length:11},(_,i)=>sats.filter(n=>n===i).length),max=Math.max(1,...freqs);return `<div class="dist">${freqs.map((n,i)=>`<div class="qrow"><label>Nota ${i}</label><div class="track"><i style="width:${n/max*100}%;background:${i>=9?'var(--green)':i>=7?'var(--orange)':'var(--red)'}"></i></div><strong>${n}</strong></div>`).join('')}</div>`})()}<div class="legend">Nota de 0 a 10 registrada na pesquisa.</div></section></div><section class="panel" style="margin-top:13px"><h2 class="display">Comentários abertos · ${comments.length}</h2><div class="comments">${comments.map(c=>`<article class="comment"><h3>${esc(c.label)}</h3><p>${esc(c.text)}</p><small>${escUnit(c.unit)} · ${esc(c.job||'Função não informada')}</small></article>`).join('')||'<div class="empty">Nenhum comentário nesta seleção.</div>'}</div></section><p class="notice">A pesquisa não contém campo próprio de nome ou e-mail. Comentários livres podem mencionar pessoas; mantenha este módulo liberado apenas para perfis que precisam consultar as respostas.</p>`}
document.addEventListener('change',e=>{if(e.target.id==='unitFilter'){unit=e.target.value;render()}else if(e.target.id==='roleFilter'){role=e.target.value;render()}});(async()=>{if(!CTX?.canModule?.('clima')){$('app').innerHTML='<div class="empty">Pesquisa de Clima não liberada para seu perfil.</div>';return}try{const {data,error}=await CTX.client.from('boha_climate_responses').select('id,survey_month,submitted_at,unit,job_role,answers').order('submitted_at',{ascending:false});if(error)throw error;ROWS=data||[];render()}catch{$('app').innerHTML='<div class="empty">Não foi possível carregar a Pesquisa de Clima.</div>'}})();
</script></body></html>
