document.addEventListener('input',e=>{if(e.target.id==='qTitle')draft.t=e.target.value;if(e.target.id==='qLink')draft.l=e.target.value});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='quick')return;e.preventDefault();
 const title=$('qTitle').value.trim(),raw=$('qLink').value.trim();if(!title&&!raw){$('qTitle').focus();return}
 let link=null;if(raw){link=safeUrl(/^https?:\/\//i.test(raw)?raw:'https://'+raw);if(!link||link.length>600){toast('Esse link não parece válido.');return}}
 const row={title:(title||linkLabel(link)||'Ideia sem título').slice(0,160),link,unit:unit==='all'?null:unit};
 const {data,error}=await CTX.client.from('boha_editorial_ideas').insert(row).select().single();
 if(error){toast('Não foi possível salvar a ideia.');return}
 IDEAS.unshift(data);draft={t:'',l:''};ifilter='open';render();$('qTitle')?.focus();toast('Ideia guardada. Toque nela para adicionar nota e quem grava.');
});
document.addEventListener('click',e=>{
 let b;
 if(b=e.target.closest('[data-ifilter]')){ifilter=b.dataset.ifilter;render();return}
 if(e.target.closest('[data-goideas]')){$('ideas')?.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(b=e.target.closest('[data-idea-plan]')){const i=IDEAS.find(x=>x.id===b.dataset.ideaPlan);if(i)open(null,null,i);return}
 if(b=e.target.closest('[data-idea-edit]')){const i=IDEAS.find(x=>x.id===b.dataset.ideaEdit);if(i)openIdea(i);return}
 if(e.target.closest('a'))return;
 if(b=e.target.closest('[data-idea]')){const i=IDEAS.find(x=>x.id===b.dataset.idea);if(i)openIdea(i);return}
 if(e.target.id==='i_cancel'){$('idlg').close();return}
 if(e.target.id==='i_del'){if(!editingIdea||!confirm('Excluir esta ideia?'))return;CTX.client.from('boha_editorial_ideas').delete().eq('id',editingIdea.id).then(({error})=>{if(error){toast('Não foi possível excluir.');return}IDEAS=IDEAS.filter(x=>x.id!==editingIdea.id);$('idlg').close();render();toast('Ideia excluída.')})}
});
$('iform').addEventListener('submit',async e=>{
 e.preventDefault();const raw=$('i_link').value.trim();let link=null;
 if(raw){link=safeUrl(/^https?:\/\//i.test(raw)?raw:'https://'+raw);if(!link||link.length>600){toast('Esse link não parece válido.');return}}
 const row={title:$('i_title').value.trim(),link,note:$('i_note').value.trim(),recorder_id:$('i_rec').value||null,sent_by:$('i_sent').value.trim(),unit:$('i_unit').value||null,status:$('i_status').value};
 if(!row.title)return;
 const out=editingIdea?await CTX.client.from('boha_editorial_ideas').update(row).eq('id',editingIdea.id).select().single():await CTX.client.from('boha_editorial_ideas').insert(row).select().single();
 if(out.error){toast('Não foi possível salvar a ideia.');return}
 if(editingIdea)IDEAS=IDEAS.map(x=>x.id===editingIdea.id?out.data:x);else IDEAS.unshift(out.data);
 $('idlg').close();render();toast('Ideia salva.');
});
/* arrastar ideia para um dia do calendário */
document.addEventListener('dragstart',e=>{const it=e.target.closest&&e.target.closest('.item[data-item]');if(it){dragItem=it.dataset.item;it.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragItem);e.dataTransfer.effectAllowed='move'}catch{}return}const a=e.target.closest&&e.target.closest('.icard[draggable="true"]');if(!a)return;dragId=a.dataset.idea;a.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch{}});
document.addEventListener('dragend',()=>{dragId=null;dragItem=null;document.querySelectorAll('.item.dragging,.icard.dragging,.day.dropok').forEach(x=>x.classList.remove('dragging','dropok'))});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('.day');if(d&&(dragId||dragItem)){e.preventDefault();d.classList.add('dropok')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.day');if(d)d.classList.remove('dropok')});
async function moveItem(id,key){
 const it=ITEMS.find(x=>x.id===id);if(!it||it.planned_date===key)return;const old=it.planned_date;
 it.planned_date=key;render();
 const {error}=await CTX.client.from('boha_editorial_items').update({planned_date:key,updated_at:new Date().toISOString()}).eq('id',id);
 if(error){it.planned_date=old;render();toast('Não foi possível mudar a data.');return}
 toast('Pauta remarcada para '+fromDate(key).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+'.');
}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.item[data-item]')){e.preventDefault();open(ITEMS.find(x=>x.id===e.target.dataset.item))}});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.day');if(d&&dragItem){e.preventDefault();d.classList.remove('dropok');const key=d.querySelector('[data-date]')?.dataset.date,id=dragItem;dragItem=null;if(key)moveItem(id,key);return}if(!d||!dragId)return;e.preventDefault();d.classList.remove('dropok');const i=IDEAS.find(x=>x.id===dragId),key=d.querySelector('[data-date]')?.dataset.date;dragId=null;if(i&&key)open(null,key,i)});
(async()=>{if(!CTX?.canModule?.('calendario')){$('app').innerHTML='<div class="empty">Calendário editorial não liberado para seu perfil.</div>';return}try{const [items,staff,ideas]=await Promise.all([CTX.client.from('boha_editorial_items').select('*').order('planned_date'),CTX.loadEmployees().catch(()=>[]),CTX.client.from('boha_editorial_ideas').select('*').order('created_at',{ascending:false}).limit(500)]);if(items.error)throw items.error;ITEMS=items.data||[];PEOPLE=staff||[];IDEAS=ideas.error?[]:(ideas.data||[]);render()}catch{$('app').innerHTML='<div class="empty">Não foi possível carregar o calendário editorial.</div>'}})();
</script></body></html>
