<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Calendário editorial</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--bg:#090909;--panel:#141414;--line:#292929;--line2:#3d3d3d;--text:#f4f4f4;--muted:#a0a0a0;--y:#fff000;--green:#49d897;--blue:#87a9ff}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--y);outline-offset:2px}[hidden]{display:none!important}.page{max-width:1220px;margin:auto;padding:26px 24px 70px}.eyebrow{margin:0;color:var(--y);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}h1{font-size:clamp(34px,5vw,52px);line-height:1;margin:8px 0}.sub{color:var(--muted);margin:0}.head{display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap}.btn{border:1px solid var(--line2);border-radius:10px;background:#171717;padding:10px 14px;font-weight:700}.btn:hover{border-color:var(--y)}.btn.primary{background:var(--y);border-color:var(--y);color:#111}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 12px}.toolbar .select{min-width:180px}.toolbar .month{display:flex;gap:8px;align-items:center;margin-left:auto}.month button{width:38px;height:38px;border:1px solid var(--line2);border-radius:10px;background:#151515}.month strong{min-width:150px;text-align:center}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line2);border-radius:999px;padding:8px 13px;background:transparent;color:#ccc}.tabs button[aria-pressed=true]{background:var(--y);border-color:var(--y);color:#111;font-weight:800}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}.weekday{background:#1d1d1d;padding:9px;text-align:center;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.day{background:#101010;min-height:120px;padding:8px;position:relative}.day.out{opacity:.46}.day.today{box-shadow:inset 0 0 0 1px var(--y)}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;color:#c8c8c8;font-size:12px}.day-add{border:0;background:transparent;color:var(--y);font-size:17px;line-height:1}.item{display:block;width:100%;text-align:left;border:1px solid #353535;background:#1a1a1a;border-radius:8px;padding:6px 7px;margin-top:5px;overflow:hidden}.item b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{display:block;color:var(--muted);font-size:10px}.item.idea{border-left:3px solid #8b8b8b}.item.scheduled{border-left:3px solid var(--blue)}.item.published{border-left:3px solid var(--green)}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 20px}.statusbar span{font-size:11px;color:var(--muted)}.statusbar i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.rowdate{width:52px;text-align:center;flex:none}.rowdate b{display:block;font-size:19px}.rowdate small{color:var(--muted);font-size:10px}.rowbody{flex:1;min-width:0}.rowbody b{display:block;overflow-wrap:anywhere}.rowbody small{color:var(--muted)}.row-actions{display:flex;gap:6px}.row-actions button{border:1px solid var(--line2);border-radius:8px;background:transparent;padding:6px 8px;font-size:11px}.empty{border:1px dashed var(--line2);border-radius:13px;padding:32px;text-align:center;color:var(--muted)}dialog{width:min(580px,calc(100% - 24px));max-height:92vh;overflow:auto;border:1px solid #444;border-radius:16px;background:#121212;color:var(--text);padding:20px}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}dialog h2{margin:0 0 14px;font-size:27px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form label{display:grid;gap:5px;color:var(--muted);font-size:12px}.form .wide{grid-column:1/-1}.field{width:100%;background:#1b1b1b;border:1px solid var(--line2);border-radius:9px;padding:10px}.form textarea{min-height:90px;resize:vertical}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hint{color:var(--muted);font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1d;border:1px solid #444;border-radius:10px;padding:10px 14px;z-index:5}
@media(max-width:850px){.board{grid-template-columns:repeat(7,minmax(100px,1fr));overflow:auto}.day{min-height:105px}.toolbar .month{margin-left:0}}@media(max-width:560px){.page{padding:18px 14px 55px}.head{align-items:start}.toolbar{align-items:stretch}.toolbar .select{flex:1}.toolbar .month{width:100%;justify-content:space-between}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}.row{align-items:start}.row-actions{flex-direction:column}}
</style></head><body><main class="page" id="app"><div class="empty">Carregando calendário…</div></main><dialog id="dlg"><form id="form"><h2 class="display" id="dlgTitle">Nova pauta</h2><div class="form"><label>Título<input class="field" id="title" maxlength="160" required></label><label>Data<input class="field" id="date" type="date" required></label><label>Unidade<select class="field" id="unit"><option value="cb">Casa Branca</option><option value="te">Santa Tereza</option><option value="ma">Macedônia</option></select></label><label>Canal<select class="field" id="channel"><option>Instagram</option><option>Facebook</option><option>TikTok</option><option>YouTube</option><option>WhatsApp</option><option>Outro</option></select></label><label>Status<select class="field" id="status"><option value="idea">Ideia</option><option value="scheduled">Agendado</option><option value="published">Publicado</option></select></label><label>Responsável<select class="field" id="employee"><option value="">Sem responsável</option></select></label><label class="wide">Legenda ou briefing<textarea class="field" id="caption" maxlength="3000" placeholder="Objetivo, chamada e informações da publicação"></textarea></label></div><div class="foot"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Salvar pauta</button></div></form></dialog><div id="toast" class="toast" hidden role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';let CTX=null;try{CTX=window.parent.bohaCtx||null}catch{};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const UNITS={cb:'Casa Branca',te:'Santa Tereza',ma:'Macedônia'},MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];let ITEMS=[],PEOPLE=[],month=new Date(new Date().getFullYear(),new Date().getMonth(),1),unit='all',editing=null;
const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,fromDate=s=>new Date(s+'T12:00:00'),unitName=u=>UNITS[u]||u;function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').hidden=true,2500)}
function render(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset),days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d}),today=dateKey(new Date());let h=`<header class="head"><div><p class="eyebrow">Marketing · planejamento</p><h1 class="display">Calendário editorial</h1><p class="sub">Pautas, canais, unidades e responsáveis em um só lugar.</p></div><button class="btn primary" data-new>+ Nova pauta</button></header><div class="toolbar"><select class="select field" id="unitFilter"><option value="all">Todas as unidades</option>${Object.entries(UNITS).map(([k,v])=>`<option value="${k}" ${unit===k?'selected':''}>${v}</option>`).join('')}</select><div class="month"><button type="button" data-shift="-1" aria-label="Mês anterior">←</button><strong>${MONTHS[m]} ${y}</strong><button type="button" data-shift="1" aria-label="Próximo mês">→</button></div></div><div class="statusbar"><span><i style="background:#888"></i>Ideia</span><span><i style="background:#87a9ff"></i>Agendado</span><span><i style="background:#49d897"></i>Publicado</span></div><div class="board">${DAYS.map(d=>`<div class="weekday">${d}</div>`).join('')}${days.map(d=>{const key=dateKey(d),items=ITEMS.filter(x=>x.planned_date===key&&(unit==='all'||x.unit===unit));return `<section class="day ${d.getMonth()!==m?'out':''} ${key===today?'today':''}"><div class="day-head"><span>${d.getDate()}</span><button class="day-add" type="button" data-date="${key}" aria-label="Adicionar pauta em ${key}">+</button></div>${items.map(x=>`<button type="button" class="item ${x.status}" data-item="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.channel)} · ${esc(unitName(x.unit))}</small></button>`).join('')}</section>`}).join('')}</div><h2 class="display" style="font-size:25px;margin:24px 0 10px">Próximas pautas</h2><section class="list">${ITEMS.filter(x=>x.planned_date>=dateKey(new Date(y,m,1))&&(unit==='all'||x.unit===unit)).sort((a,b)=>a.planned_date.localeCompare(b.planned_date)).slice(0,16).map(x=>{const d=fromDate(x.planned_date);return `<article class="row"><div class="rowdate"><b>${pad(d.getDate())}</b><small>${MONTHS[d.getMonth()].slice(0,3)}</small></div><div class="rowbody"><b>${esc(x.title)}</b><small>${esc(unitName(x.unit))} · ${esc(x.channel)} · ${x.employee_id?esc(PEOPLE.find(p=>p.id===x.employee_id)?.name||'Responsável'): 'Sem responsável'} · ${({idea:'Ideia',scheduled:'Agendado',published:'Publicado'})[x.status]}</small></div><div class="row-actions"><button data-edit="${x.id}">Editar</button><button data-del="${x.id}">Excluir</button></div></article>`}).join('')||'<div class="empty">Nenhuma pauta planejada para este mês.</div>'}</section>`;$('app').innerHTML=h}
function open(item=null,planned=null){editing=item;$('dlgTitle').textContent=item?'Editar pauta':'Nova pauta';$('title').value=item?.title||'';$('date').value=item?.planned_date||planned||dateKey(new Date());$('unit').value=item?.unit||'cb';$('channel').value=item?.channel||'Instagram';$('status').value=item?.status||'idea';$('caption').value=item?.caption||'';$('employee').innerHTML='<option value="">Sem responsável</option>'+PEOPLE.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.unit_label)}</option>`).join('');$('employee').value=item?.employee_id||'';$('dlg').showModal()}
document.addEventListener('click',async e=>{const shift=e.target.closest('[data-shift]'),date=e.target.closest('[data-date]'),item=e.target.closest('[data-item]'),edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(shift){month.setMonth(month.getMonth()+Number(shift.dataset.shift));render()}else if(date)open(null,date.dataset.date);else if(item)open(ITEMS.find(x=>x.id===item.dataset.item));else if(edit)open(ITEMS.find(x=>x.id===edit.dataset.edit));else if(del){if(!confirm('Excluir esta pauta?'))return;const {error}=await CTX.client.from('boha_editorial_items').delete().eq('id',del.dataset.del);if(error){toast('Não foi possível excluir.');return}ITEMS=ITEMS.filter(x=>x.id!==del.dataset.del);render()}else if(e.target.closest('[data-new]'))open();else if(e.target.id==='cancel')$('dlg').close()});document.addEventListener('change',e=>{if(e.target.id==='unitFilter'){unit=e.target.value;render()}});
$('form').addEventListener('submit',async e=>{e.preventDefault();const row={title:$('title').value.trim(),planned_date:$('date').value,unit:$('unit').value,channel:$('channel').value,status:$('status').value,caption:$('caption').value.trim(),employee_id:$('employee').value||null,updated_at:new Date().toISOString()};const out=editing?await CTX.client.from('boha_editorial_items').update(row).eq('id',editing.id).select().single():await CTX.client.from('boha_editorial_items').insert(row).select().single();if(out.error){toast('Não foi possível salvar a pauta.');return}if(editing)ITEMS=ITEMS.map(x=>x.id===editing.id?out.data:x);else ITEMS.push(out.data);$('dlg').close();render();toast('Pauta salva.')});
(async()=>{if(!CTX?.canModule?.('calendario')){$('app').innerHTML='<div class="empty">Calendário editorial não liberado para seu perfil.</div>';return}try{const [items,staff]=await Promise.all([CTX.client.from('boha_editorial_items').select('*').order('planned_date'),CTX.loadEmployees().catch(()=>[])]);if(items.error)throw items.error;ITEMS=items.data||[];PEOPLE=staff||[];render()}catch{$('app').innerHTML='<div class="empty">Não foi possível carregar o calendário editorial.</div>'}})();
</script></body></html>
