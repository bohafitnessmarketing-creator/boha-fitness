const FILE_MAX=10*1024*1024,FILE_LIMIT=12,OKMIME={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'},BUCKET='boha-editorial';
let FILES=[],FURL={};const AT={a:null,i:null};
const mkAtt=()=>({existing:[],inherit:[],pending:[],removed:new Set(),removedInh:new Set()});
const filesOf=(type,id)=>FILES.filter(f=>f[type==='item'?'item_id':'idea_id']===id);
const fmtSize=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';
async function signFiles(){const paths=[...new Set(FILES.map(f=>f.path))];if(!paths.length)return;try{const {data}=await CTX.client.storage.from(BUCKET).createSignedUrls(paths,3600);(data||[]).forEach(x=>{if(x&&x.signedUrl&&x.path)FURL[x.path]=x.signedUrl})}catch{}}
function attHTML(files){
 if(!files.length)return '';const shown=files.slice(0,5);
 return `<div class="athumbs">${shown.map(f=>{const u=FURL[f.path];if(!u)return '';return f.mime==='application/pdf'?`<a class="pdf" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(f.name)}">📄 ${esc(f.name)}</a>`:`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(f.name)}"><img src="${esc(u)}" alt="${esc(f.name)}" loading="lazy"></a>`}).join('')}${files.length>shown.length?`<span class="more">+${files.length-shown.length}</span>`:''}</div>`;
}
function attRows(st,key){
 const rows=[];
 st.existing.filter(f=>!st.removed.has(f.id)).forEach(f=>rows.push({f,kind:'existing',id:f.id}));
 st.inherit.filter(f=>!st.removedInh.has(f.id)).forEach(f=>rows.push({f,kind:'inherit',id:f.id}));
 st.pending.forEach((p,i)=>rows.push({f:{name:p.name,mime:p.file.type,size:p.file.size,path:null},kind:'pending',id:i,url:p.url}));
 return rows;
}
function attRender(key){
 const st=AT[key],box=$(key+'_list');if(!box||!st)return;
 box.innerHTML=attRows(st,key).map(r=>{const f=r.f,u=r.url||FURL[f.path],isImg=f.mime!=='application/pdf';
  return `<div class="arow">${isImg&&u?`<img class="th" src="${esc(u)}" alt="">`:`<span class="th">${isImg?'🖼':'📄'}</span>`}<div class="nm"><b title="${esc(f.name)}">${esc(f.name)}${r.kind==='pending'?'<span class="new">novo</span>':''}</b><small>${fmtSize(f.size)}</small></div>${r.kind!=='pending'&&u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Abrir</a>`:''}<button type="button" data-att-rm="${key}:${r.kind}:${r.id}" aria-label="Remover ${esc(f.name)}">Remover</button></div>`}).join('');
}
function attAdd(key,list){
 const st=AT[key];if(!st)return;let rejected=0;
 for(const file of list){
  if(!OKMIME[file.type]){rejected++;continue}
  if(attRows(st,key).length>=FILE_LIMIT){toast('Máximo de '+FILE_LIMIT+' anexos por vez.');break}
  if(file.type==='application/pdf'&&file.size>FILE_MAX){toast('O PDF "'+file.name+'" passa de 10 MB.');continue}
  st.pending.push({file,name:file.name.slice(0,160),url:file.type!=='application/pdf'?URL.createObjectURL(file):null});
 }
 if(rejected)toast('Só imagens (JPG, PNG, WebP) e PDF.');
 attRender(key);
}
async function toJpeg(file,max){
 const u=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u}),sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  for(const q of [.9,.8,.7]){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b&&b.size<=FILE_MAX)return b}throw new Error('grande')}finally{URL.revokeObjectURL(u)}
}
async function cleanupPaths(paths){
 paths=[...new Set(paths)];if(!paths.length)return;
 try{const {data}=await CTX.client.from('boha_editorial_files').select('path').in('path',paths);const keep=new Set((data||[]).map(x=>x.path)),gone=paths.filter(p=>!keep.has(p));if(gone.length)await CTX.client.storage.from(BUCKET).remove(gone)}catch{}
}
async function commitAtt(key,type,pid){
 const st=AT[key];if(!st)return 0;const col=type==='item'?'item_id':'idea_id';let failed=0;
 const gone=st.existing.filter(f=>st.removed.has(f.id));
 if(gone.length){const {error}=await CTX.client.from('boha_editorial_files').delete().in('id',gone.map(f=>f.id));if(error)failed+=gone.length;else{const ids=new Set(gone.map(f=>f.id));FILES=FILES.filter(f=>!ids.has(f.id));await cleanupPaths(gone.map(f=>f.path))}}
 const rows=st.inherit.filter(f=>!st.removedInh.has(f.id)).map(f=>({[col]:pid,path:f.path,name:f.name,mime:f.mime,size:f.size}));
 for(const p of st.pending){
  try{
   let blob=p.file,mime=p.file.type,ext=OKMIME[mime];
   if(mime!=='application/pdf'&&p.file.size>8*1024*1024){blob=await toJpeg(p.file,2400);mime='image/jpeg';ext='jpg'}
   if(blob.size>FILE_MAX){failed++;continue}
   const path=crypto.randomUUID()+'.'+ext,up=await CTX.client.storage.from(BUCKET).upload(path,blob,{contentType:mime});
   if(up.error){failed++;continue}
   rows.push({[col]:pid,path,name:p.name,mime,size:blob.size});
  }catch{failed++}
  if(p.url)URL.revokeObjectURL(p.url);
 }
 if(rows.length){const {data,error}=await CTX.client.from('boha_editorial_files').insert(rows).select();if(error)failed+=rows.length;else FILES.push(...data)}
 await signFiles();return failed;
}
document.addEventListener('click',e=>{

});

(async()=>{if(!CTX?.canModule?.('calendario')){$('app').innerHTML='<div class="empty">Calendário editorial não liberado para seu perfil.</div>';return}try{const [items,staff,ideas,files]=await Promise.all([CTX.client.from('boha_editorial_items').select('*').order('planned_date'),CTX.loadEmployees().catch(()=>[]),CTX.client.from('boha_editorial_ideas').select('*').order('created_at',{ascending:false}).limit(500),CTX.client.from('boha_editorial_files').select('*').order('created_at').limit(3000)]);if(items.error)throw items.error;ITEMS=items.data||[];PEOPLE=staff||[];IDEAS=ideas.error?[]:(ideas.data||[]);FILES=files.error?[]:(files.data||[]);await signFiles();render()}catch{$('app').innerHTML='<div class="empty">Não foi possível carregar o calendário editorial.</div>'}})();
