<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Banco de funcionários</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} :root{--bg:#0a0a0a;--panel:#141414;--line:#292929;--line2:#3a3a3a;--text:#f4f4f4;--muted:#a1a1a1;--yellow:#fff000;--green:#49d897;--red:#ff6961}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer} :focus-visible{outline:2px solid var(--yellow);outline-offset:3px} [hidden]{display:none!important}
.page{max-width:1150px;margin:auto;padding:28px 24px 60px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);margin:0}.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}h1{font-size:clamp(34px,5vw,52px);line-height:1;margin:9px 0}.intro{margin:0;color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}.summary{display:flex;gap:10px;margin-top:23px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:12px 16px;min-width:135px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:22px}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;background:#171717;font-weight:700}.btn:hover{border-color:var(--yellow)}.btn.primary{background:var(--yellow);color:#111;border-color:var(--yellow)}.btn.danger{color:#ff8a80}.btn.danger:hover{border-color:#ff5a4f;color:#ff5a4f}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line2);border-radius:99px;padding:8px 13px;background:transparent;color:#c7c7c7}.tabs button[aria-pressed=true]{border-color:var(--yellow);background:var(--yellow);color:#111;font-weight:800}.search,.select,.field{background:#1a1a1a;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}.search{margin-left:auto;min-width:220px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:15px;display:flex;gap:13px;align-items:center;min-width:0;transition:opacity .2s,border-color .2s}.card:hover{border-color:#555}.card.former{opacity:.5;filter:saturate(.55)}.photo{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#242424;border:1px solid #444;flex:none}.fallback{display:grid;place-items:center;color:var(--yellow);font-size:21px;font-weight:800}.who{min-width:0;flex:1}.who h2{font-size:15px;margin:0;overflow-wrap:anywhere}.who p{font-size:12px;color:var(--muted);margin:3px 0}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.badge{font-size:10px;border-radius:99px;padding:3px 8px;background:#222;color:#c4c4c4}.badge.unit{color:var(--yellow);background:#292700}.badge.active{color:var(--green);background:#10271b}.badge.former{color:#aaa}.badge.access{color:#94c4ff;background:#172235}.edit{border:1px solid var(--line2);border-radius:9px;padding:7px 9px;background:transparent;font-size:12px}.empty{grid-column:1/-1;text-align:center;border:1px dashed var(--line2);border-radius:14px;padding:40px 20px;color:var(--muted)}dialog{width:min(560px,calc(100% - 24px));max-height:90vh;border:1px solid #444;border-radius:18px;padding:0;background:#121212;color:var(--text)}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}.modal{padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.modal h2{font-size:27px;margin:0 0 16px}.x{border:1px solid var(--line2);background:transparent;border-radius:50%;width:38px;height:38px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:var(--muted);display:grid;gap:5px}.form .wide{grid-column:1/-1}.photo-edit{display:flex;align-items:center;gap:12px}.foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.hint{font-size:12px;color:var(--muted);margin:12px 0 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1c;border:1px solid #4a4a4a;padding:11px 16px;border-radius:10px;z-index:4}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{align-items:start;flex-direction:column}.summary{flex-wrap:wrap}.search{margin-left:0;flex:1}}
@media(max-width:560px){.page{padding:20px 15px 50px}.grid{grid-template-columns:minmax(0,1fr)}.stat{flex:1;min-width:0}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.head>*{min-width:0}.stat{padding:10px}.stat b{font-size:19px}.filters{align-items:stretch}.search{width:100%;min-width:0;order:2}.actions{width:100%}.actions button{flex:1}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}
.also{margin:2px 0 0;font-size:12px;color:var(--yellow)}
.mlbl{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}.mlbl small{opacity:.8}.mchips{display:flex;flex-wrap:wrap;gap:6px}.mchips button{border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);background:transparent}.mchips button:hover{color:var(--text)}.mchips button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#111}.mods{margin:2px 0 0;font-size:12px;color:var(--yellow)}
</style></head><body><main class="page" id="app"><div class="empty">Carregando cadastro…</div></main><dialog id="editor"><form id="employeeForm" class="modal"><div class="modal-head"><div><p class="eyebrow" id="formKicker">Cadastro</p><h2 class="display" id="formTitle">Funcionário</h2></div><button class="x" type="button" id="close" aria-label="Fechar">×</button></div><div class="form"><div class="wide photo-edit"><div id="photoPreview" class="photo fallback">?</div><div><button type="button" class="btn" id="choosePhoto">Adicionar foto</button><input type="file" id="photoInput" accept="image/*" hidden><p class="hint">Foto opcional · até 2 MB</p></div></div><label>Nome completo<input class="field" id="fName" maxlength="160" required></label><label>Unidade<select class="field" id="fUnit"><option value="cb">Casa Branca</option><option value="te">Santa Tereza</option><option value="ma">Macedônia</option></select></label><label>Função<select class="field" id="fTitle" required style="text-transform:uppercase"></select></label><div class="wide" id="modsBox" hidden><span class="mlbl">Modalidades que dá aula <small>marque uma ou mais</small></span><div class="mchips" id="modsChips" role="group" aria-label="Modalidades"></div><label style="margin-top:8px">Outra modalidade <small>opcional, se não estiver na lista</small><input class="field" id="fModOther" maxlength="40" autocomplete="off"></label></div><label>Situação<select class="field" id="fStatus"><option value="active">Ativo</option><option value="former">Ex-funcionário</option></select></label></div><p class="hint">A função exata alimenta a Hierarquia e o filtro das Escalas. O acesso ao sistema é controlado separadamente em Gestão de acessos.</p><div class="foot"><button type="button" class="btn danger" id="del" hidden style="margin-right:auto">Excluir cadastro</button><button type="button" class="btn" id="dup" hidden title="Cadastrar a mesma pessoa em outra função">Duplicar (outra função)</button><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save" type="submit">Salvar cadastro</button></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';let CTX=null;try{CTX=(window.parent!==window&&window.parent.bohaCtx)||window.bohaCtx||null}catch{};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UNITS={all:'Todos',cb:'Casa Branca',te:'Santa Tereza',ma:'Macedônia',rede:'Todas as unidades'};let dupFrom=null,ROWS=[],URLS={},FILTER={unit:'all',status:'active',q:'',role:'all'},editing=null,photoFile=null;
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2800)}
const unitLabel=u=>UNITS[u]||'Unidade';
const MODS=['A.B.S','Boxe','Cross','Fit Dance','Funcional','G.A.P','H.I.T','Jiu-Jitsu','Jump','Muay-Thai','Pilates','Sertanejo','Spinning','Step','Zumba'];
const isCol=t=>/coletiv/.test(String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase());
const modsOf=r=>Array.isArray(r.modalities)?r.modalities:[];
const ROLES=['GERENTE','RECEPCIONISTA','ESTAGIÁRIO','PROFESSOR DE AULAS COLETIVAS','PROFESSOR DE SALA','AUXILIAR DE LIMPEZA','MANUTENÇÃO','MARKETING'];
const norm=t=>String(t||'').trim().toLocaleLowerCase('pt-BR');
const isStd=t=>ROLES.some(x=>norm(x)===norm(t));
function fillMods(list){
 const sel=new Set(list||[]);$('modsChips').innerHTML=MODS.map(m=>`<button type="button" data-mod="${esc(m)}" aria-pressed="${sel.has(m)}">${esc(m)}</button>`).join('');
 $('fModOther').value=(list||[]).filter(m=>!MODS.includes(m)).join(', ');syncMods();
}
function syncMods(){$('modsBox').hidden=!isCol($('fTitle').value)}
function readMods(){
 if(!isCol($('fTitle').value))return [];
 const a=[...$('modsChips').querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.mod),o=$('fModOther').value.split(',').map(x=>x.trim()).filter(Boolean).map(x=>x.slice(0,40));
 return [...new Set([...a,...o])].slice(0,12);
}
function fillRoles(cur){const c=String(cur||'').trim();$('fTitle').innerHTML='<option value="">ESCOLHA A FUNÇÃO…</option>'+ROLES.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')+(c&&!isStd(c)?`<option value="${esc(c)}">${esc(c.toLocaleUpperCase('pt-BR'))} (CADASTRO ANTIGO — ESCOLHA UMA FUNÇÃO)</option>`:'');const m=ROLES.find(x=>norm(x)===norm(c));$('fTitle').value=m||c||''}
function photo(r){const url=URLS[r.id];return url?`<img class="photo" src="${esc(url)}" alt="Foto de ${esc(r.name)}">`:`<span class="photo fallback" aria-hidden="true">${esc((r.name||'?').trim().charAt(0).toUpperCase())}</span>`}
function filtered(){const q=FILTER.q.trim().toLocaleLowerCase('pt-BR');return ROWS.filter(r=>(FILTER.unit==='all'||r.unit===FILTER.unit)&&(FILTER.status==='all'||r.status===FILTER.status)&&(FILTER.role==='all'||(FILTER.role==='_outras'?!isStd(r.title):norm(r.title)===norm(FILTER.role)))&&(!q||`${r.name} ${r.title} ${modsOf(r).join(' ')}`.toLocaleLowerCase('pt-BR').includes(q)))}
function render(){const actives=ROWS.filter(r=>r.status==='active').length,formers=ROWS.length-actives,list=filtered(),admin=['admin','marketing','gerente'].includes(CTX?.profile?.role);$('app').innerHTML=`<header class="head"><div><p class="eyebrow">Equipe · Cadastro interno</p><h1 class="display">Banco de funcionários</h1><p class="intro">Um cadastro por unidade para consultar a equipe e escolher pessoas nos outros módulos.</p><div class="summary"><div class="stat"><small>Funcionários ativos</small><b>${actives}</b></div><div class="stat"><small>Ex-funcionários</small><b>${formers}</b></div><div class="stat"><small>Cadastros</small><b>${ROWS.length}</b></div></div></div>${admin?'<div class="actions"><button class="btn primary" data-new>+ Adicionar pessoa</button></div>':''}</header><div class="filters"><div class="tabs" aria-label="Unidade">${Object.entries(UNITS).map(([k,v])=>`<button type="button" data-unit="${k}" aria-pressed="${FILTER.unit===k}">${v}</button>`).join('')}</div><input class="search" id="search" type="search" placeholder="Buscar nome ou cargo" value="${esc(FILTER.q)}" aria-label="Buscar funcionário"></div><div class="filters" style="margin-top:0"><div class="tabs" aria-label="Situação">${[['active','Ativos'],['former','Ex-funcionários'],['all','Todos']].map(([k,v])=>`<button type="button" data-status="${k}" aria-pressed="${FILTER.status===k}">${v}</button>`).join('')}</div><select class="field" id="roleFilter" aria-label="Filtrar por função" style="width:auto;padding:8px 12px"><option value="all">TODAS AS FUNÇÕES</option>${ROLES.map(x=>`<option value="${esc(x)}" ${FILTER.role===x?'selected':''}>${esc(x)}</option>`).join('')}<option value="_outras" ${FILTER.role==='_outras'?'selected':''}>OUTRAS / DEFINIR FUNÇÃO</option></select><span class="intro">${list.length} cadastro${list.length===1?'':'s'}</span></div><section class="grid">${list.length?list.map(r=>`<article class="card ${r.status==='former'?'former':''}">${photo(r)}<div class="who"><h2>${esc(r.name)}</h2><p>${esc(r.title?r.title.toLocaleUpperCase('pt-BR'):'FUNÇÃO NÃO INFORMADA')}</p>${isCol(r.title)?(modsOf(r).length?`<p class="mods">Modalidades: ${modsOf(r).map(esc).join(' · ')}</p>`:'<p class="mods" style="color:var(--red)">Definir modalidade</p>'):''}${(()=>{const o=ROWS.filter(x=>x.id!==r.id&&x.unit===r.unit&&norm(x.name)===norm(r.name)&&x.status==='active').map(x=>x.title).filter(Boolean);return o.length?`<p class="also">Também: ${o.map(t=>esc(t.toLocaleUpperCase('pt-BR'))).join(' · ')}</p>`:''})()}<div class="badges"><span class="badge unit">${unitLabel(r.unit)}</span><span class="badge ${r.status}">${r.status==='active'?'Ativo':'Ex-funcionário'}</span>${r.hub_access?'<span class="badge access">Acesso ao Hub</span>':''}${r.title&&!isStd(r.title)?'<span class="badge" title="Abra em Editar e escolha uma das funções da lista">Definir função</span>':''}</div></div>${admin&&(r.unit!=='rede'||['admin','marketing'].includes(CTX?.profile?.role))?`<button type="button" class="edit" data-edit="${r.id}">Editar</button><button type="button" class="edit" data-dup="${r.id}" title="Cadastrar a mesma pessoa em outra função">Duplicar</button>`:''}</article>`).join(''):`<div class="empty">Nenhum cadastro neste filtro. Adicione uma pessoa ou altere os filtros.</div>`}</section>`}
async function load(){const {data,error}=await CTX.client.rpc('boha_employee_list');if(error)throw error;ROWS=data||[];await Promise.all(ROWS.filter(r=>r.photo_path).map(async r=>{const {data:d}=await CTX.client.storage.from('boha-employees').createSignedUrl(r.photo_path,3600);if(d?.signedUrl)URLS[r.id]=d.signedUrl}));render()}
function openForm(r=null){editing=r;photoFile=null;$('formTitle').textContent=r?'Editar cadastro':'Novo funcionário';$('formKicker').textContent=r?unitLabel(r.unit):'Adicionar pessoa';$('fName').value=r?.name||'';{const rd=['admin','marketing'].includes(CTX?.profile?.role);$('fUnit').innerHTML=['cb','te','ma'].filter(k=>UNITS[k]).map(k=>`<option value="${k}">${UNITS[k]}</option>`).join('')+(rd||r?.unit==='rede'?`<option value="rede">TODAS AS UNIDADES (rede)</option>`:'');$('fUnit').disabled=r?.unit==='rede'&&!rd}$('fUnit').value=r?.unit||(CTX?.profile?.unit&&UNITS[CTX.profile.unit]&&CTX.profile.unit!=='rede'?CTX.profile.unit:'cb');fillRoles(r?.title);fillMods(r?modsOf(r):[]);$('fStatus').value=r?.status||'active';const old=$('photoPreview'),url=r?URLS[r.id]:null;old.outerHTML=url?`<img class="photo" id="photoPreview" src="${esc(url)}" alt="Foto atual">`:`<span class="photo fallback" id="photoPreview">${esc((r?.name||'?').charAt(0).toUpperCase())}</span>`;$('del').hidden=!(r&&(r.unit==='rede'?CTX?.profile?.role==='admin':['admin','gerente'].includes(CTX?.profile?.role)));$('dup').hidden=!r;dupFrom=null;$('editor').showModal();$('fName').focus()}
async function compress(file){const bitmap=await createImageBitmap(file),scale=Math.min(1,900/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(ok=>canvas.toBlob(ok,'image/jpeg',.82));if(!blob||blob.size>2097152)throw Error('Foto maior que 2 MB');return blob}
function startDup(src){
 if(!src)return;
 openForm(null);dupFrom=src;
 $('formTitle').textContent='Duplicar cadastro';$('formKicker').textContent='Mesma pessoa em outra função ou outra unidade';
 $('fName').value=src.name;$('fUnit').value=src.unit;$('fStatus').value=src.status||'active';fillRoles(src.title);fillMods(modsOf(src));
 $('del').hidden=true;$('dup').hidden=true;$('fTitle').focus();
 toast('Mude a função ou a unidade (ou as duas) e salve.');
}
$('dup').addEventListener('click',()=>{const src=editing;if(!src)return;$('editor').close();startDup(src)});
document.addEventListener('click',async e=>{const u=e.target.closest('[data-unit]'),s=e.target.closest('[data-status]'),ed=e.target.closest('[data-edit]');if(u){FILTER.unit=u.dataset.unit;render()}else if(s){FILTER.status=s.dataset.status;render()}else if(ed){openForm(ROWS.find(x=>x.id===ed.dataset.edit))}else if(e.target.closest('[data-dup]')){startDup(ROWS.find(x=>x.id===e.target.closest('[data-dup]').dataset.dup))}else if(e.target.closest('[data-new]'))openForm();else if(e.target.closest('#close,#cancel'))$('editor').close();else if(e.target.closest('#choosePhoto'))$('photoInput').click()});
document.addEventListener('change',e=>{if(e.target.id==='roleFilter'){FILTER.role=e.target.value;render()}else if(e.target.id==='fTitle')syncMods()});
document.addEventListener('click',e=>{const m=e.target.closest('[data-mod]');if(m)m.setAttribute('aria-pressed',m.getAttribute('aria-pressed')==='true'?'false':'true')});
document.addEventListener('input',e=>{if(e.target.id==='search'){FILTER.q=e.target.value;render();$('search').focus();$('search').setSelectionRange(FILTER.q.length,FILTER.q.length)}});
$('del').addEventListener('click',async()=>{
 if(!editing||!['admin','gerente'].includes(CTX?.profile?.role)){toast('Seu perfil não pode excluir cadastros.');return}
 if(!confirm('Excluir o cadastro de "'+editing.name+'"?\n\nIsso apaga também as escalas dessa pessoa. Para manter o histórico, mude a situação para "Ex-funcionário" em vez de excluir.\n\nEsta ação não pode ser desfeita.'))return;
 const b=$('del');b.disabled=true;
 try{const {error}=await CTX.client.from('boha_employees').delete().eq('id',editing.id);if(error)throw error;
  if(editing.photo_path)await CTX.client.storage.from('boha-employees').remove([editing.photo_path]).catch(()=>{});
  const nm=editing.name;editing=null;$('editor').close();await load();toast('Cadastro de '+nm+' excluído.')}
 catch(err){toast('Não foi possível excluir. Você só pode excluir pessoas da sua unidade.')}finally{b.disabled=false}
});
$('photoInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Selecione um arquivo de imagem.');return}photoFile=await compress(f);$('photoPreview').outerHTML=`<img class="photo" id="photoPreview" src="${URL.createObjectURL(photoFile)}" alt="Prévia da foto">`;e.target.value=''});
$('employeeForm').addEventListener('submit',async e=>{e.preventDefault();if(!CTX?.profile||!['admin','marketing','gerente'].includes(CTX.profile.role)){toast('Seu perfil não pode editar o cadastro.');return}if(!$('fTitle').value){toast('Escolha a função da pessoa.');return}if(isCol($('fTitle').value)&&!readMods().length){toast('Marque ao menos uma modalidade que o professor dá aula.');return}if(dupFrom&&norm($('fTitle').value)===norm(dupFrom.title)&&$('fUnit').value===dupFrom.unit){toast('Mude a unidade ou a função: já existe este cadastro igual.');return}const row={unit:$('fUnit').value,name:$('fName').value.trim(),title:$('fTitle').value.trim(),status:$('fStatus').value,modalities:readMods()};const b=$('save');b.disabled=true;try{let id=editing?.id;if(editing){const {error}=await CTX.client.from('boha_employees').update({...row,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error}else{const {data,error}=await CTX.client.from('boha_employees').insert(row).select('id').single();if(error)throw error;id=data.id;if(dupFrom?.photo_path&&!photoFile){const np=`${id}.jpg`,{error:ce}=await CTX.client.storage.from('boha-employees').copy(dupFrom.photo_path,np);if(!ce)await CTX.client.from('boha_employees').update({photo_path:np}).eq('id',id)}}if(photoFile){const blob=await compress(photoFile),path=`${id}.jpg`,{error}=await CTX.client.storage.from('boha-employees').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(error)throw error;const {error:updateError}=await CTX.client.from('boha_employees').update({photo_path:path}).eq('id',id);if(updateError)throw updateError}await load();$('editor').close();const was=dupFrom;dupFrom=null;toast(was?'Cadastro duplicado: '+row.name+' · '+row.title+' · '+(UNITS[row.unit]||'')+'.':'Cadastro salvo.')}catch(err){toast(err?.code==='23505'?'Essa pessoa já está cadastrada com essa função nesta unidade. Escolha outra função.':'Não foi possível salvar. Verifique os dados e tente novamente.')}finally{b.disabled=false}});
(async()=>{{const lk=CTX?.profile?.unit,mu=CTX?.profile?.units||[];if(lk)Object.keys(UNITS).forEach(k=>{if(k==='rede')return;if(k!=='all'?(mu.length>1?!mu.includes(k):k!==lk):mu.length<2)delete UNITS[k]})};if(CTX?.profile?.unit)FILTER.unit=CTX.profile.unit;if(!CTX?.canModule?.('funcionarios')){$('app').innerHTML='<div class="empty">O Banco de funcionários não está liberado para o seu perfil. Peça ao administrador para habilitá-lo em Gestão de acessos.</div>';return}try{await load()}catch{$('app').innerHTML='<div class="empty">Não foi possível carregar os funcionários. Atualize a página.</div>'}})();
</script></body></html>
