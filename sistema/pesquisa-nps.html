<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Pesquisa de NPS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--bg:#0a0a0a;--panel:#151515;--line:#2d2d2d;--muted:#a2a2a2;--text:#f3f3f3;--y:#fff000;--green:#42d392;--yellow:#ffce4a;--red:#ff6b62}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--y);outline-offset:2px}[hidden]{display:none!important}.page{max-width:1180px;margin:auto;padding:27px 23px 70px}.eyebrow{margin:0;color:var(--y);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}h1{font-size:clamp(34px,5vw,52px);line-height:1;margin:8px 0}.sub{color:var(--muted);margin:0}.head{display:flex;justify-content:space-between;align-items:end;gap:15px}.btn{background:#181818;border:1px solid #444;border-radius:10px;padding:10px 14px;font-weight:700}.btn:hover{border-color:var(--y)}.btn.primary{background:var(--y);color:#111;border-color:var(--y)}.filter{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 14px}.field{background:#191919;border:1px solid #414141;border-radius:9px;padding:9px 11px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.metric span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.07em}.metric b{display:block;font-size:29px;margin:4px 0}.metric small{color:var(--muted)}.nps{font-family:Anton,Impact,sans-serif;font-size:38px!important;color:var(--y)}.section{display:grid;grid-template-columns:1.2fr .8fr;gap:13px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.panel h2{font-size:22px;margin:0 0 10px}.scorebars{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));align-items:end;gap:7px;height:180px;border-bottom:1px solid #444}.score{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;height:100%}.score .bar{width:min(100%,30px);min-height:2px;border-radius:5px 5px 0 0}.score small{color:var(--muted);font-size:10px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.unitcards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.unitcard{background:#111;border:1px solid #333;border-radius:11px;padding:13px}.unitcard b{display:block;font-size:24px;color:var(--y)}.unitcard span{font-size:11px;color:var(--muted)}.responses{display:grid;gap:8px;margin-top:13px}.response{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:start}.badge-score{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#252525;font-weight:800}.response p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.response small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.del{border:0;background:transparent;color:var(--muted);font-size:18px}.empty{border:1px dashed #444;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}dialog{width:min(520px,calc(100% - 22px));border:1px solid #444;border-radius:16px;background:#121212;color:var(--text);padding:20px}dialog::backdrop{background:#000c;backdrop-filter:blur(4px)}dialog h2{font-size:27px;margin:0 0 14px}.form{display:grid;gap:11px}.form label{display:grid;gap:5px;color:var(--muted);font-size:12px}.form textarea{min-height:92px;resize:vertical}.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hint{font-size:11px;color:var(--muted);margin:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1c1c;border:1px solid #444;border-radius:10px;padding:10px 14px}
@media(max-width:720px){.section{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.unitcards{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}@media(max-width:500px){.page{padding:19px 14px 50px}.filter>*{flex:1;min-width:120px}.response{grid-template-columns:38px 1fr auto}.metric{padding:11px}.metric b{font-size:25px}}
</style></head><body><main class="page" id="app"><div class="empty">Carregando respostas…</div></main><dialog id="dlg"><form id="form"><h2 class="display">Registrar resposta de NPS</h2><div class="form"><div class="row"><label>Unidade<select class="field" id="unit"><option value="cb">Casa Branca</option><option value="te">Santa Tereza</option><option value="ma">Macedônia</option></select></label><label>Nota de 0 a 10<select class="field" id="score" required><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label></div><label>Data<input class="field" id="date" type="date" required></label><label>Comentário opcional<textarea class="field" id="feedback" maxlength="2000" placeholder="Não escreva nome, telefone ou dado pessoal do aluno."></textarea></label><p class="hint">A resposta é anônima. Não inclua informações que identifiquem o aluno.</p></div><div class="foot"><button class="btn" id="cancel" type="button">Cancelar</button><button class="btn primary" type="submit">Salvar resposta</button></div></form></dialog><div class="toast" id="toast" hidden role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';let CTX=null;try{CTX=window.parent.bohaCtx||null}catch{};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const UNITS={all:'Todas as unidades',cb:'Casa Branca',te:'Santa Tereza',ma:'Macedônia'};let ROWS=[],unit='all',period='all';const day=s=>new Date(s),fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}),promoters=r=>r.score>=9,passives=r=>r.score>=7&&r.score<=8,detractors=r=>r.score<=6;function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2400)}function scope(){const cutoff=period==='all'?null:new Date(Date.now()-Number(period)*864e5);return ROWS.filter(r=>(unit==='all'||r.unit===unit)&&(!cutoff||day(r.created_at)>=cutoff))}
function render(){const rows=scope(),n=rows.length,p=rows.filter(promoters).length,pa=rows.filter(passives).length,d=rows.filter(detractors).length,score=n?Math.round((p-d)*100/n):0,counts=Array.from({length:11},(_,i)=>rows.filter(r=>r.score===i).length),max=Math.max(1,...counts);$('app').innerHTML=`<header class="head"><div><p class="eyebrow">Experiência dos alunos · pesquisa anônima</p><h1 class="display">Pesquisa de NPS</h1><p class="sub">Acompanhe a recomendação e os comentários por unidade.</p></div><button class="btn primary" data-add>+ Registrar resposta</button></header><div class="filter"><select class="field" id="unitFilter">${Object.entries(UNITS).map(([k,v])=>`<option value="${k}" ${unit===k?'selected':''}>${v}</option>`).join('')}</select><select class="field" id="period"><option value="all" ${period==='all'?'selected':''}>Todo o período</option><option value="30" ${period==='30'?'selected':''}>Últimos 30 dias</option><option value="90" ${period==='90'?'selected':''}>Últimos 90 dias</option></select></div><section class="metrics"><div class="metric"><span>NPS</span><b class="nps">${n?score:'—'}</b><small>Promotores menos detratores</small></div><div class="metric"><span>Respostas</span><b>${n}</b><small>${unit==='all'?'Todas as unidades':UNITS[unit]}</small></div><div class="metric"><span>Promotores</span><b>${n?Math.round(p*100/n)+'%':'—'}</b><small>Notas 9 e 10 · ${p}</small></div><div class="metric"><span>Detratores</span><b>${n?Math.round(d*100/n)+'%':'—'}</b><small>Notas de 0 a 6 · ${d}</small></div></section><div class="section"><section class="panel"><h2 class="display">Distribuição das notas</h2><div class="scorebars">${counts.map((c,i)=>`<div class="score"><small>${c||''}</small><span class="bar" style="height:${Math.max(c?5:0,c/max*130)}px;background:${i>=9?'var(--green)':i>=7?'var(--yellow)':'var(--red)'}"></span><small>${i}</small></div>`).join('')}</div><div class="legend"><span><i style="background:var(--red)"></i>Detratores 0–6: ${d}</span><span><i style="background:var(--yellow)"></i>Neutros 7–8: ${pa}</span><span><i style="background:var(--green)"></i>Promotores 9–10: ${p}</span></div></section><section class="panel"><h2 class="display">Comparar unidades</h2><div class="unitcards">${Object.entries(UNITS).filter(([k])=>k!=='all').map(([k,label])=>{const a=rows.filter(r=>r.unit===k),pp=a.filter(promoters).length,dd=a.filter(detractors).length;return `<article class="unitcard"><b>${a.length?Math.round((pp-dd)*100/a.length):'—'}</b><span>${label} · ${a.length} respostas</span></article>`}).join('')}</div><p class="hint" style="margin-top:10px">NPS = (% promotores − % detratores), em escala de −100 a 100.</p></section></div><h2 class="display" style="font-size:25px;margin:24px 0 8px">Comentários da pesquisa</h2><section class="responses">${rows.slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(r=>`<article class="response"><span class="badge-score">${r.score}</span><div><p>${esc(r.feedback||'Sem comentário')}</p><small>${UNITS[r.unit]} · ${fmt(day(r.created_at))}</small></div><button class="del" type="button" data-del="${r.id}" aria-label="Excluir resposta">×</button></article>`).join('')||'<div class="empty">Nenhuma resposta neste período.</div>'}</section>`}
document.addEventListener('change',e=>{if(e.target.id==='unitFilter')unit=e.target.value;else if(e.target.id==='period')period=e.target.value;else return;render()});document.addEventListener('click',async e=>{if(e.target.closest('[data-add]')){$('date').value=new Date().toLocaleDateString('sv-SE');$('dlg').showModal()}else if(e.target.id==='cancel')$('dlg').close();else{const del=e.target.closest('[data-del]');if(del&&confirm('Excluir esta resposta?')){const {error}=await CTX.client.from('boha_nps_responses').delete().eq('id',del.dataset.del);if(error){toast('Não foi possível excluir.');return}ROWS=ROWS.filter(r=>r.id!==del.dataset.del);render()}}});$('form').addEventListener('submit',async e=>{e.preventDefault();const row={unit:$('unit').value,score:Number($('score').value),feedback:$('feedback').value.trim(),created_at:new Date($('date').value+'T12:00:00').toISOString(),created_by:CTX.profile?.uid||null};const {data,error}=await CTX.client.from('boha_nps_responses').insert(row).select().single();if(error){toast('Não foi possível salvar a resposta.');return}ROWS.push(data);$('form').reset();$('dlg').close();render();toast('Resposta registrada.')});
(async()=>{if(!CTX?.canModule?.('nps')){$('app').innerHTML='<div class="empty">Pesquisa de NPS não liberada para seu perfil.</div>';return}try{const {data,error}=await CTX.client.from('boha_nps_responses').select('id,unit,score,feedback,created_at').order('created_at',{ascending:false});if(error)throw error;ROWS=data||[];render()}catch{$('app').innerHTML='<div class="empty">Não foi possível carregar as respostas de NPS.</div>'}})();
</script></body></html>
