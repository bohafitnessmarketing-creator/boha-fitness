<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · A fazer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#0a0a0a;--panel:#141414;--line:#242424;--line2:#333;--text:#f2f2f2;--muted:#9b9b9b;--y:#fff000;--good:#3ddc84;--bad:#ff5a4f;--warn:#ff9f2e;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
[hidden]{display:none!important}
.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;color:var(--y);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--y)}
.page{max-width:820px;margin:0 auto;padding:26px 24px 80px}
h1{font-size:clamp(36px,6vw,56px);line-height:1;margin:12px 0 6px}
.sub{color:var(--muted);margin:0}
.progress{display:flex;align-items:center;gap:12px;margin:18px 0 0;font-size:13.5px;color:var(--muted)}
.progress b{color:var(--text)}
.bar{flex:1;height:8px;background:#1f1f1f;border-radius:99px;overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--y);border-radius:99px;transition:width .5s var(--ease)}
.notif{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0 0;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;color:#cfcfcf}
.notif.on{border-color:rgba(61,220,132,.3)}
.notif.ask{border-color:rgba(255,240,0,.4);background:#17160b}
.btn-y{background:var(--y);color:#111;font-weight:800;border-radius:10px;padding:10px 16px;font-size:14px;white-space:nowrap;text-align:center}
.btn-y:disabled{opacity:.5}
.btn-g{border:1px solid var(--line2);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;transition:border-color .2s,color .2s}
.btn-g:hover{border-color:var(--y);color:var(--y)}
.btn-g.danger:hover{border-color:var(--bad);color:var(--bad)}
.add{margin:20px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.add:focus-within{border-color:rgba(255,240,0,.45)}
.add-main{display:flex;gap:10px}
.inp{background:#1c1c1c;border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;width:100%;font-size:15px}
.inp:focus{border-color:var(--y)}
textarea.inp{min-height:84px;resize:vertical}
.add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--y);border-color:var(--y);color:#111}
.add-row .inp{width:auto;padding:7px 10px;font-size:14px}
.more{margin-top:10px;display:grid;gap:10px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.link{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--y)}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:22px;margin:0;line-height:1}
.sec-h span{font-size:13px;color:var(--muted)}
.sec.late .sec-h h2{color:var(--bad)}
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden;transition:border-color .2s;animation:in .3s var(--ease) backwards}
.task:hover{border-color:#3a3a3a}
.task.open{border-color:rgba(255,240,0,.45)}
.t-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #555;display:grid;place-items:center;margin-top:1px;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.chk:hover{border-color:var(--y);transform:scale(1.08)}
.chk svg{opacity:0;transition:opacity .15s}
.task.done .chk{background:var(--good);border-color:var(--good)}
.task.done .chk svg{opacity:1}
.t-body{flex:1;min-width:0;display:block;width:100%}
.t-title{display:block;font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.task.done .t-title{text-decoration:line-through;color:#777;font-weight:500}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.t-meta .tm{color:var(--y);font-weight:700}
.t-meta .late{color:var(--bad);font-weight:700}
.t-notes{display:block;margin-top:4px;font-size:13px;color:#b5b5b5;white-space:pre-wrap;overflow-wrap:anywhere}
.edit{padding:4px 14px 14px 52px;display:grid;gap:10px}
.edit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.edit-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.empty{margin-top:22px;padding:34px 20px;border:1px dashed var(--line2);border-radius:16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
details.sec summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary h2{font-size:18px;margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b1b1b;border:1px solid rgba(255,240,0,.45);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:40;max-width:calc(100vw - 32px);display:flex;gap:14px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--y);font-weight:700}
.state{padding:60px 20px;text-align:center;color:var(--muted)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (max-width:600px){.page{padding:18px 14px 70px}.add-main{flex-direction:column}.edit{padding-left:14px}.edit-grid{grid-template-columns:1fr 1fr}.edit-grid>:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="page" id="page"><div class="state">Carregando…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="toastBtn" hidden></button></div>
<script>
'use strict';
let CTX=null;try{CTX=(window.parent!==window&&window.parent.bohaCtx)||window.bohaCtx||null}catch{CTX=null}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REPEAT={none:'Não repete',daily:'Todo dia',weekdays:'Seg a sex',weekly:'Toda semana'};
const CHECK='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let TASKS=[],EMPLOYEES=[],openId=null,addMore=false,addDate='today',spawned={};
const iso=d=>d.toLocaleDateString('sv-SE');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
function dateLabel(s){const t=today();if(s===t)return 'Hoje';if(s===addDays(t,1))return 'Amanhã';if(s===addDays(t,-1))return 'Ontem';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','')}
function nextDate(t){const base=t.due_date&&t.due_date>today()?t.due_date:today();if(t.repeat==='daily')return addDays(base,1);if(t.repeat==='weekly')return addDays(t.due_date||base,7)>today()?addDays(t.due_date||base,7):addDays(base,7);let d=addDays(base,1);while([0,6].includes(new Date(d+'T12:00:00').getDay()))d=addDays(d,1);return d}
const isLate=t=>!t.done_at&&t.due_date&&(t.due_date<today()||(t.due_date===today()&&t.due_time&&t.due_time<new Date().toTimeString().slice(0,5)));
function toast(text,action,fn){$('toastTxt').textContent=text;const b=$('toastBtn');b.hidden=!action;if(action){b.textContent=action;b.onclick=()=>{$('toast').classList.remove('show');fn()}}$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),action?6000:3000)}
const sync=()=>{try{CTX.refreshReminders&&CTX.refreshReminders()}catch{}};

async function load(){
 const since=new Date(Date.now()-14*864e5).toISOString().slice(0,19)+'Z';
 const [tasks,staff]=await Promise.all([CTX.client.from('boha_tasks').select('*').or('done_at.is.null,done_at.gte.'+since),CTX.loadEmployees?CTX.loadEmployees().catch(()=>[]):Promise.resolve([])]);
 if(tasks.error)throw tasks.error;TASKS=tasks.data||[];EMPLOYEES=staff||[];render();
}
const employeeName=id=>EMPLOYEES.find(x=>x.id===id)?.name||'';
const employeeOptions=id=>`<option value="">Ninguém selecionado</option>${EMPLOYEES.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.name)} · ${esc(x.unit_label)}</option>`).join('')}`;
function notifHTML(){
 if(!('Notification' in window))return '<div class="notif"><span>Neste aparelho o aviso aparece <b>dentro do sistema</b>, enquanto ele estiver aberto, quando chegar a hora da tarefa.</span></div>';
 const p=Notification.permission;
 if(p==='granted')return '<div class="notif on"><span>🔔 <b>Avisos ativados.</b> Na hora marcada você recebe uma notificação — o sistema precisa estar aberto (pode ficar em segundo plano).</span></div>';
 if(p==='denied')return '<div class="notif"><span>As notificações estão bloqueadas neste navegador. O aviso ainda aparece dentro do sistema; para liberar, clique no cadeado ao lado do endereço do site.</span></div>';
 return '<div class="notif ask"><span><b>Quer ser avisado na hora da tarefa?</b> Ative as notificações deste aparelho.</span><button class="btn-y" id="askNotif">Ativar avisos</button></div>';
}
function taskHTML(t){
 const late=isLate(t),open=openId===t.id,meta=[];
 if(t.due_time)meta.push(`<span class="${late?'late':'tm'}">${esc(t.due_time)}</span>`);
 if(t.due_date&&(t.due_date!==today()||t.done_at))meta.push(`<span class="${late&&!t.due_time?'late':''}">${dateLabel(t.due_date)}</span>`);
 if(late)meta.push('<span class="late">atrasada</span>');
 if(t.repeat!=='none')meta.push('<span>↻ '+REPEAT[t.repeat]+'</span>');
 if(t.employee_id&&employeeName(t.employee_id))meta.push(`<span>Falar com ${esc(employeeName(t.employee_id))}</span>`);
 let h=`<div class="task ${t.done_at?'done':''} ${open?'open':''}" data-id="${t.id}"><div class="t-row"><button class="chk" data-act="toggle" aria-label="${t.done_at?'Desmarcar':'Concluir'}: ${esc(t.title)}">${CHECK}</button><button class="t-body" data-act="open" aria-expanded="${open}"><span class="t-title">${esc(t.title)}</span>${meta.length?`<span class="t-meta">${meta.join('')}</span>`:''}${t.notes&&!open?`<span class="t-notes">${esc(t.notes.length>160?t.notes.slice(0,160)+'…':t.notes)}</span>`:''}</button></div>`;
 if(open)h+=`<div class="edit"><div><label class="lbl" for="eTitle">O que fazer</label><input class="inp" id="eTitle" maxlength="200" value="${esc(t.title)}"></div><div class="edit-grid"><div><label class="lbl" for="eDate">Dia</label><input class="inp" id="eDate" type="date" value="${esc(t.due_date||'')}"></div><div><label class="lbl" for="eTime">Hora do aviso</label><input class="inp" id="eTime" type="time" value="${esc(t.due_time||'')}"></div><div><label class="lbl" for="eRep">Repetir</label><select class="inp" id="eRep">${Object.entries(REPEAT).map(([k,v])=>`<option value="${k}" ${t.repeat===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div><label class="lbl" for="eEmployee">Funcionário para conversar</label><select class="inp" id="eEmployee">${employeeOptions(t.employee_id)}</select></div><div><label class="lbl" for="eNotes">Detalhes</label><textarea class="inp" id="eNotes" maxlength="4000" placeholder="O que levar, onde fica…">${esc(t.notes)}</textarea></div><div class="edit-actions"><button class="btn-g danger" data-act="del">Excluir</button><span style="display:flex;gap:8px"><button class="btn-g" data-act="open">Fechar</button><button class="btn-y" data-act="save">Salvar</button></span></div></div>`;
 return h+'</div>';
}
const byTime=(a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')||(a.due_time||'99:99').localeCompare(b.due_time||'99:99')||a.created_at.localeCompare(b.created_at);
function render(){
 const t0=today(),open=TASKS.filter(t=>!t.done_at).sort(byTime),done=TASKS.filter(t=>t.done_at).sort((a,b)=>b.done_at.localeCompare(a.done_at));
 const late=open.filter(t=>t.due_date&&t.due_date<t0),td=open.filter(t=>t.due_date===t0),next=open.filter(t=>t.due_date&&t.due_date>t0),free=open.filter(t=>!t.due_date);
 const doneToday=done.filter(t=>iso(new Date(t.done_at))===t0),tot=td.length+late.length+doneToday.length,pct=tot?Math.round(doneToday.length/tot*100):0;
 const name=(CTX.profile&&CTX.profile.name||'').split(' ')[0];
 const sec=(title,list,cls,hint)=>list.length?`<section class="sec ${cls||''}"><div class="sec-h"><h2 class="display">${title}</h2><span>${list.length}${hint?' · '+hint:''}</span></div>${list.map(taskHTML).join('')}</section>`:'';
 const keep={title:$('nTitle')?$('nTitle').value:'',time:$('nTime')?$('nTime').value:'',cdate:$('nDate')?$('nDate').value:'',notes:$('nNotes')?$('nNotes').value:'',rep:$('nRep')?$('nRep').value:'none',employee:$('nEmployee')?$('nEmployee').value:''};
 $('page').innerHTML=`<p class="eyebrow">A fazer</p><h1 class="display">${name?esc(name)+', ':''}seu dia</h1><p class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())} · só você vê esta lista.</p>
 <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><span>${tot?`<b>${doneToday.length} de ${tot}</b> feitas hoje`:'Nada marcado para hoje ainda'}</span></div>${notifHTML()}
 <form class="add" id="addForm" autocomplete="off"><div class="add-main"><input class="inp" id="nTitle" maxlength="200" placeholder="O que você precisa fazer?" aria-label="Nova tarefa" required><button class="btn-y" type="submit">Adicionar</button></div>
 <div class="add-row"><button type="button" class="chip" data-d="today" aria-pressed="${addDate==='today'}">Hoje</button><button type="button" class="chip" data-d="tomorrow" aria-pressed="${addDate==='tomorrow'}">Amanhã</button><button type="button" class="chip" data-d="custom" aria-pressed="${addDate==='custom'}">Outro dia</button><button type="button" class="chip" data-d="none" aria-pressed="${addDate==='none'}">Sem data</button>${addDate==='custom'?`<input class="inp" id="nDate" type="date" aria-label="Dia" min="${t0}">`:''}${addDate!=='none'?'<input class="inp" id="nTime" type="time" aria-label="Hora do aviso" title="Hora do aviso (opcional)">':''}<button type="button" class="link" id="moreBtn">${addMore?'Menos opções':'Detalhes e repetição'}</button></div>
 ${addMore?`<div class="more"><div><label class="lbl" for="nEmployee">Funcionário para conversar</label><select class="inp" id="nEmployee">${employeeOptions('')}</select></div><div><label class="lbl" for="nNotes">Detalhes</label><textarea class="inp" id="nNotes" maxlength="4000" placeholder="O que levar, onde fica…"></textarea></div><div><label class="lbl" for="nRep">Repetir</label><select class="inp" id="nRep" style="max-width:220px">${Object.entries(REPEAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>`:''}</form>
 ${sec('Atrasadas',late,'late','de dias anteriores')}${sec('Hoje',td)}${sec('Próximos dias',next)}${sec('Sem data',free)}
 ${!open.length?`<div class="empty"><b>${done.length?'Tudo feito por aqui 👏':'Sua lista está vazia'}</b>${done.length?'Adicione a próxima tarefa quando precisar.':'Escreva acima o que precisa fazer. Com uma hora marcada, o sistema te avisa.'}</div>`:''}
 ${done.length?`<details class="sec" ${render.doneOpen?'open':''} id="doneBox"><summary><h2 class="display">Concluídas</h2><span style="font-size:13px;color:var(--muted)">${done.length} nos últimos 14 dias · ver</span></summary>${done.map(taskHTML).join('')}</details>`:''}`;
 $('nTitle').value=keep.title;if($('nTime'))$('nTime').value=keep.time;if($('nDate'))$('nDate').value=keep.cdate||addDays(t0,2);if($('nNotes'))$('nNotes').value=keep.notes;if($('nRep'))$('nRep').value=keep.rep;if($('nEmployee'))$('nEmployee').value=keep.employee;
}
async function addTask(){
 const title=$('nTitle').value.trim();if(!title)return;
 const t0=today(),due_date=addDate==='today'?t0:addDate==='tomorrow'?addDays(t0,1):addDate==='custom'?($('nDate').value||null):null;
 if(addDate==='custom'&&!due_date){toast('Escolha o dia.');return}
 const row={title,due_date,due_time:due_date&&$('nTime')&&$('nTime').value?$('nTime').value:null,notes:$('nNotes')?$('nNotes').value.trim():'',repeat:$('nRep')?$('nRep').value:'none',employee_id:$('nEmployee')?.value||null};
 if(row.repeat!=='none'&&!row.due_date){toast('Para repetir, a tarefa precisa de um dia.');return}
 const {data,error}=await CTX.client.from('boha_tasks').insert(row).select().single();
 if(error||!data){toast('Não foi possível salvar. Tente de novo.');return}
 TASKS.push(data);['nTitle','nTime','nNotes'].forEach(i=>{if($(i))$(i).value=''});if($('nRep'))$('nRep').value='none';if($('nEmployee'))$('nEmployee').value='';
 if(addDate==='none'||addDate==='custom')addDate='today';render();$('nTitle').focus();sync();
 toast(row.due_time?`Anotado. Aviso ${dateLabel(row.due_date).toLowerCase()} às ${row.due_time}.`:'Anotado.');
}
async function toggle(id){
 const t=TASKS.find(x=>x.id===id);if(!t)return;
 const done=!t.done_at,patch={done_at:done?new Date().toISOString():null};
 const {error}=await CTX.client.from('boha_tasks').update(patch).eq('id',id);
 if(error){toast('Não foi possível atualizar.');return}
 Object.assign(t,patch);let msg=done?'Feito ✔':'Tarefa reaberta.';
 if(done&&t.repeat!=='none'){
  const nx={title:t.title,notes:t.notes,due_date:nextDate(t),due_time:t.due_time,repeat:t.repeat,employee_id:t.employee_id||null};
  const r=await CTX.client.from('boha_tasks').insert(nx).select().single();
  if(!r.error&&r.data){TASKS.push(r.data);spawned[id]=r.data.id;msg=`Feito ✔ Próxima: ${dateLabel(nx.due_date).toLowerCase()}${nx.due_time?' às '+nx.due_time:''}.`}
 }else if(!done&&spawned[id]){
  const sid=spawned[id];delete spawned[id];const r=await CTX.client.from('boha_tasks').delete().eq('id',sid);if(!r.error)TASKS=TASKS.filter(x=>x.id!==sid);
 }
 if(openId===id)openId=null;render();sync();
 done?toast(msg,'Desfazer',()=>toggle(id)):toast(msg);
}
async function saveEdit(id){
 const t=TASKS.find(x=>x.id===id),title=$('eTitle').value.trim();if(!t)return;if(!title){toast('A tarefa precisa de um nome.');return}
 const patch={title,due_date:$('eDate').value||null,due_time:$('eTime').value||null,repeat:$('eRep').value,notes:$('eNotes').value.trim(),employee_id:$('eEmployee')?.value||null};
 if(patch.due_time&&!patch.due_date)patch.due_date=today();
 if(patch.repeat!=='none'&&!patch.due_date){toast('Para repetir, a tarefa precisa de um dia.');return}
 if(patch.due_date!==t.due_date||patch.due_time!==t.due_time)patch.notified_at=null;
 const {error}=await CTX.client.from('boha_tasks').update(patch).eq('id',id);
 if(error){toast('Não foi possível salvar.');return}
 Object.assign(t,patch);openId=null;render();sync();toast('Tarefa atualizada.');
}
async function del(id){
 const t=TASKS.find(x=>x.id===id);if(!t||!confirm(`Excluir “${t.title}”?`))return;
 const {error}=await CTX.client.from('boha_tasks').delete().eq('id',id);
 if(error){toast('Não foi possível excluir.');return}
 TASKS=TASKS.filter(x=>x.id!==id);openId=null;render();sync();toast('Tarefa excluída.');
}
document.addEventListener('click',async e=>{
 const d=e.target.closest('[data-d]');if(d){addDate=d.dataset.d;render();(addDate==='custom'?$('nDate'):$('nTitle')).focus();return}
 if(e.target.closest('#moreBtn')){addMore=!addMore;render();(addMore?$('nNotes'):$('nTitle')).focus();return}
 if(e.target.closest('#askNotif')){try{await Notification.requestPermission()}catch{}render();sync();if(Notification.permission==='granted')toast('Avisos ativados neste aparelho.');return}
 const a=e.target.closest('[data-act]');if(!a)return;const id=a.closest('.task').dataset.id,act=a.dataset.act;
 if(act==='toggle')toggle(id);
 else if(act==='open'){const box=$('doneBox');render.doneOpen=!!(box&&box.open);openId=openId===id?null:id;render();if(openId)$('eTitle').focus()}
 else if(act==='save')saveEdit(id);
 else if(act==='del')del(id);
});
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();addTask()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='eTitle'){e.preventDefault();saveEdit(openId)}else if(e.key==='Escape'&&openId){openId=null;render()}});
document.addEventListener('toggle',e=>{if(e.target.id==='doneBox')render.doneOpen=e.target.open},true);
let lastDay=today();setInterval(()=>{if(document.hidden)return;const hasForm=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);if(!hasForm&&(today()!==lastDay||TASKS.some(t=>!t.done_at&&t.due_time))){lastDay=today();render()}},60000);

 if(!CTX||!CTX.client){$('page').innerHTML='<div class="state">Abra o módulo A fazer pelo <a href="../equipe.html#checklist" style="color:var(--y)">sistema interno da Boha</a>.</div>';return}
 try{await load();window.bohaReload=load}catch{$('page').innerHTML='<div class="state">Não foi possível carregar suas tarefas. Atualize a página.</div>'}
