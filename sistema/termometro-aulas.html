<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Termômetro das gravações</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--bg:#0a0a0a;--panel:#141414;--line:#292929;--muted:#a0a0a0;--text:#f2f2f2;--y:#fff000;--green:#3ddc84;--orange:#ffac45;--red:#ff655b}html,body{background:var(--bg)}body{margin:0;color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--y);outline-offset:2px}[hidden]{display:none!important}.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}.page{max-width:1260px;margin:auto;padding:26px 28px 80px}.eye{color:var(--y);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;margin:0}.head{display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap}.head h1{font-size:clamp(32px,4vw,52px);line-height:1.06;margin:8px 0}.head p:last-child{color:var(--muted);margin:0}.source{border:1px solid var(--line);padding:8px 13px;border-radius:30px;font-size:11px;color:var(--muted)}.tabs{display:flex;gap:9px;margin:26px 0 0}.tabs button,.view button,.days button,.filter button{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 15px}.tabs button{font-weight:800;min-width:160px;text-align:left}.tabs button[aria-pressed=true],.view button[aria-pressed=true],.days button[aria-pressed=true],.filter button[aria-pressed=true]{border-color:var(--y);color:var(--y);background:#25240f}.tabs small{display:block;color:var(--muted);font-size:11px;font-weight:500}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:18px}.kpi{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:16px}.kpi span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.kpi b{display:block;font-size:26px;margin-top:4px}.kpi small{color:var(--muted);font-size:11px}.section{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin:30px 0 13px}.section h2{font-size:27px;line-height:1;margin:0}.section p{color:var(--muted);font-size:12px;margin:5px 0 0}.view,.filter,.days{display:flex;gap:7px;flex-wrap:wrap}.view button,.filter button,.days button{font-size:12px;font-weight:700;padding:8px 11px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;width:230px;max-width:100%}.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.class{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:17px;min-width:0}.class .top{display:flex;justify-content:space-between;gap:9px;align-items:start}.class h3{font-size:23px;line-height:1;margin:0}.badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;border:1px solid currentColor;border-radius:99px;white-space:nowrap}.good{color:var(--green)}.attention{color:var(--orange)}.priority{color:var(--red)}.unknown{color:#b7b7b7}.class .last{font-size:27px;font-weight:800;line-height:1.1;margin:23px 0 3px}.class .sub{color:var(--muted);font-size:12px}.class .line{border-top:1px solid var(--line);margin:16px 0 12px}.class .times{display:flex;flex-wrap:wrap;gap:6px}.time{border:1px solid #373737;border-radius:7px;padding:4px 7px;font-size:11px;color:#d4d4d4}.class .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;color:var(--muted);font-size:11px}.add{background:var(--y);border:0;color:#111;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800}.grade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.day h3{margin:0 0 11px;font-size:19px;color:var(--y)}.slot{border-top:1px solid var(--line);padding:8px 0}.slot b{display:block;font-size:11px;color:var(--muted)}.slot strong{font-size:12px;line-height:1.2;display:block}.note{border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--muted);font-size:12px;margin-top:20px}.empty{border:1px dashed var(--line);border-radius:13px;padding:40px;color:var(--muted);text-align:center}.modal{border:1px solid #4a4a4a;border-radius:16px;background:#171717;color:var(--text);width:min(420px,calc(100% - 24px));padding:25px}.modal::backdrop{background:rgba(0,0,0,.75)}.modal h2{font-size:27px;margin:0 0 15px}.modal label{display:block;color:var(--muted);font-size:12px}.modal input{display:block;width:100%;margin:6px 0 18px;padding:11px;background:#0d0d0d;border:1px solid #444;border-radius:9px;color:#fff}.modal .actions{display:flex;justify-content:end;gap:8px}.modal .actions button{padding:9px 13px;border-radius:8px;border:1px solid #444;background:#252525}.modal .actions .save{background:var(--y);color:#111;border-color:var(--y);font-weight:800}@media(max-width:1000px){.classes{grid-template-columns:repeat(2,1fr)}.grade{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.page{padding:19px 16px 70px}.kpis{grid-template-columns:repeat(2,1fr)}.classes{grid-template-columns:1fr}.grade{grid-template-columns:repeat(2,1fr)}.tabs button{min-width:0;flex:1}.head h1{font-size:35px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.thermo{height:10px;border-radius:99px;background:#333;position:relative;margin:16px 0 4px;overflow:hidden}.thermo::before,.thermo::after{content:'';position:absolute;top:0;bottom:0;width:2px;background:#777;z-index:1}.thermo::before{left:31%}.thermo::after{left:67%}.thermo span{display:block;height:100%;border-radius:inherit;min-width:0;transition:width .4s}.thermo.no-date{background:repeating-linear-gradient(135deg,#333 0,#333 6px,#252525 6px,#252525 12px)}.thermo.no-date::before,.thermo.no-date::after{display:none}.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.class:hover .thermo{box-shadow:0 0 0 2px rgba(255,240,0,.2)}
</style></head><body><main class="page" id="app"><div class="empty">Carregando aulas…</div></main><dialog class="modal" id="postDialog"><form id="postForm"><h2 class="display">Registrar postagem</h2><p id="postLabel"></p><label>Data da postagem<input id="postDate" type="date" required></label><div class="actions"><button type="button" id="cancelPost">Cancelar</button><button class="save" type="submit">Salvar data</button></div></form></dialog>
<script>
'use strict';let CTX=null;try{CTX=(window.parent!==window&&window.parent.bohaCtx)||window.bohaCtx||null}catch{}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const UNITS={cb:'Casa Branca',te:'Santa Tereza'},DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb'];let POST=[],SCHEDULE=[],S={unit:'cb',view:'classes',day:0,status:'all',q:''},editing=null;const canEdit=()=>['admin','marketing'].includes(CTX?.profile?.role);const nowBR=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const today=()=>new Date(nowBR()+'T12:00:00Z');const daysSince=d=>Math.max(0,Math.round((today()-new Date(d+'T12:00:00Z'))/86400000));const br=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';const statusOf=r=>{if(!r.last)return 'unknown';const n=daysSince(r.last);return n<=14?'good':n<=30?'attention':'priority'};const labelOf={good:'Em dia',attention:'Atenção',priority:'Priorizar',unknown:'Sem data'};
const bar=r=>{if(!r.last)return '<div class="thermo no-date" role="img" aria-label="Sem data de postagem registrada" title="O documento não informou uma data"></div><div class="scale"><span>Sem data registrada</span></div>';const n=daysSince(r.last),c={good:'var(--green)',attention:'var(--orange)',priority:'var(--red)'}[statusOf(r)];return `<div class="thermo" role="img" aria-label="${n} dias desde a última postagem" title="${n} dias desde a última postagem"><span style="width:${Math.max(3,Math.min(100,n/45*100))}%;background:${c}"></span></div><div class="scale"><span>0d</span><span>14d</span><span>30d</span><span>45d+</span></div>`};
function rows(){const p=POST.filter(x=>x.unit===S.unit),slots=SCHEDULE.filter(x=>x.unit===S.unit);return p.map(r=>{const times=slots.filter(x=>x.class_name===r.class_name).sort((a,b)=>a.weekday-b.weekday||a.start_time.localeCompare(b.start_time)),dates=(r.post_dates||[]).slice().sort();return {...r,times,last:dates.at(-1)||null,dates}}).sort((a,b)=>{const order={priority:0,attention:1,unknown:2,good:3};return order[statusOf(a)]-order[statusOf(b)]||a.class_name.localeCompare(b.class_name,'pt-BR')})}
function render(){const all=rows(),f=all.filter(r=>(S.day===0||r.times.some(x=>x.weekday===S.day))&&(S.status==='all'||statusOf(r)===S.status)&&r.class_name.toLocaleLowerCase('pt-BR').includes(S.q.toLocaleLowerCase('pt-BR'))),slotCount=SCHEDULE.filter(x=>x.unit===S.unit).length,dated=all.filter(x=>x.last).length,prio=all.filter(x=>statusOf(x)==='priority').length;const inputFocused=document.activeElement?.id==='search';let h=`<header class="head"><div><p class="eye">Marketing · aulas coletivas</p><h1 class="display">Termômetro das gravações<br>das aulas coletivas</h1><p>Planeje o conteúdo por modalidade e consulte a grade semanal.</p></div><span class="source">Datas registradas no documento de postagens</span></header><div class="tabs" role="group" aria-label="Unidade">${Object.entries(UNITS).map(([k,n])=>`<button data-unit="${k}" aria-pressed="${S.unit===k}">${n}<small>${SCHEDULE.filter(x=>x.unit===k).length} horários na grade</small></button>`).join('')}</div><section class="kpis"><div class="kpi"><span>Modalidades</span><b>${all.length}</b><small>Nesta unidade</small></div><div class="kpi"><span>Horários semanais</span><b>${slotCount}</b><small>Segunda a sábado</small></div><div class="kpi"><span>Com data registrada</span><b>${dated}</b><small>Última postagem conhecida</small></div><div class="kpi"><span>Priorizar</span><b>${prio}</b><small>Mais de 30 dias desde a postagem</small></div></section><div class="section"><div><h2 class="display">Acompanhar aulas</h2><p>Sem data significa que o documento não informou postagem.</p></div><div class="view" role="group" aria-label="Visualização"><button data-view="classes" aria-pressed="${S.view==='classes'}">Modalidades</button><button data-view="grade" aria-pressed="${S.view==='grade'}">Grade semanal</button></div></div>`;
if(S.view==='classes'){h+=`<div class="toolbar"><div class="days" role="group" aria-label="Filtrar dia"><button data-day="0" aria-pressed="${S.day===0}">Todos os dias</button>${DAYS.map((d,i)=>`<button data-day="${i+1}" aria-pressed="${S.day===i+1}">${d}</button>`).join('')}</div><input id="search" type="search" aria-label="Buscar aula" placeholder="Buscar modalidade…" value="${esc(S.q)}"></div><div class="filter" role="group" aria-label="Filtrar situação" style="margin-bottom:14px">${[['all','Todas'],['priority','Priorizar'],['attention','Atenção'],['good','Em dia'],['unknown','Sem data']].map(([k,l])=>`<button data-status="${k}" aria-pressed="${S.status===k}">${l}</button>`).join('')}</div>`;h+=f.length?`<div class="classes">${f.map(r=>{const st=statusOf(r),n=r.last?daysSince(r.last):null;return `<article class="class"><div class="top"><h3 class="display">${esc(r.class_name)}</h3><span class="badge ${st}">${labelOf[st]}</span></div><div class="last">${n===null?'Sem data':n+' dias'}</div><div class="sub">${r.last?'Última postagem: '+br(r.last):'Nenhuma data registrada no documento'}</div>${bar(r)}<div class="line"></div><div class="times">${r.times.length?r.times.map(x=>`<span class="time">${DAYS[x.weekday-1]} ${x.start_time.slice(0,5)}</span>`).join(''):'<span class="sub">Sem horário na grade enviada</span>'}</div><div class="foot"><span>${r.dates.length} ${r.dates.length===1?'postagem registrada':'postagens registradas'}</span>${canEdit()?`<button class="add" data-add="${r.id}">+ Registrar postagem</button>`:''}</div></article>`}).join('')}</div>`:'<div class="empty">Nenhuma modalidade corresponde aos filtros.</div>'}
else{const slots=SCHEDULE.filter(x=>x.unit===S.unit).sort((a,b)=>a.start_time.localeCompare(b.start_time));h+=`<div class="grade">${DAYS.map((d,i)=>`<section class="day"><h3 class="display">${d}</h3>${slots.filter(x=>x.weekday===i+1).map(x=>`<div class="slot"><b>${x.start_time.slice(0,5)}</b><strong>${esc(x.class_name)}</strong></div>`).join('')||'<p class="sub">Sem aulas</p>'}</section>`).join('')}</div>`}
h+=`<p class="note">O status usa os dias desde a última <b>postagem registrada</b>: até 14 dias em dia, 15 a 30 dias atenção, acima de 30 dias priorizar. Ele ajuda no planejamento e não confirma a data da gravação. A Macedônia não oferece aulas coletivas.</p>`;$('app').innerHTML=h;if(inputFocused){$('search').focus();$('search').setSelectionRange(S.q.length,S.q.length)}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-unit],[data-view],[data-day],[data-status],[data-add]');if(!t)return;if(t.dataset.unit){S.unit=t.dataset.unit;S.day=0;S.status='all';S.q=''}else if(t.dataset.view)S.view=t.dataset.view;else if(t.dataset.day!==undefined)S.day=+t.dataset.day;else if(t.dataset.status)S.status=t.dataset.status;else if(t.dataset.add){editing=POST.find(r=>r.id===t.dataset.add);$('postLabel').textContent=editing.class_name+' · '+UNITS[editing.unit];$('postDate').value=nowBR();$('postDialog').showModal();$('postDate').focus();return}render()});document.addEventListener('input',e=>{if(e.target.id==='search'){S.q=e.target.value;render()}});$('cancelPost').onclick=()=>$('postDialog').close();$('postForm').onsubmit=async e=>{e.preventDefault();if(!editing||!canEdit())return;const d=$('postDate').value;if(!d)return;const dates=[...new Set([...(editing.post_dates||[]),d])].sort();const b=$('postForm').querySelector('.save');b.disabled=true;const {error}=await CTX.client.from('boha_class_postings').update({post_dates:dates,updated_at:new Date().toISOString()}).eq('id',editing.id);b.disabled=false;if(error){alert('Não foi possível salvar a data. Tente novamente.');return}editing.post_dates=dates;$('postDialog').close();render()};
(async()=>{if(!CTX?.client||!['admin','marketing'].includes(CTX.profile?.role)){$('app').innerHTML='<div class="empty">Abra o Termômetro pelo acesso de Marketing ou de administrador no Hub.</div>';return}try{const [p,s]=await Promise.all([CTX.client.from('boha_class_postings').select('id,unit,class_name,post_dates'),CTX.client.from('boha_class_schedule').select('unit,weekday,start_time,class_name')]);if(p.error||s.error)throw p.error||s.error;POST=p.data||[];SCHEDULE=s.data||[];render()}catch{$('app').innerHTML='<div class="empty">Não foi possível carregar o Termômetro. Atualize a página.</div>'}})();
</script></body></html>
