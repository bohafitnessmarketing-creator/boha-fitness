<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Escalas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1a1a19;--line:#242424;--line2:#333;--text:#f2f2f2;--muted:#9b9b9b;--y:#fff000;--good:#3ddc84;--bad:#ff5a4f;--warn:#ff9f2e;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
[hidden]{display:none!important}
.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;color:var(--y);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--y)}
.btn-y{background:var(--y);color:#111;font-weight:800;border-radius:10px;padding:10px 16px;font-size:14px;white-space:nowrap;text-align:center}.btn-y:disabled{opacity:.5;cursor:wait}
.btn-g{border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap;text-align:center;transition:border-color .2s,color .2s}
.btn-g:hover{border-color:var(--y);color:var(--y)}.btn-g.danger:hover{border-color:var(--bad);color:var(--bad)}
.page{max-width:1280px;margin:0 auto;padding:22px 28px 80px}
.hd h1{font-size:clamp(34px,5vw,60px);line-height:1;margin:12px 0 6px}.hd p.sub{margin:0;color:var(--muted);font-size:14px;max-width:580px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.seg{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none;max-width:100%}.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}.funcbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 0}.funcbar .fl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}.funcbar button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--muted)}.funcbar button b{margin-left:4px;font-weight:700;opacity:.7}.funcbar button:hover{color:var(--text)}.funcbar button[aria-pressed="true"]{background:var(--y);color:#111;border-color:var(--y)}@media print{.funcbar{display:none}}
.seg button:hover{color:var(--text)}.seg button[aria-pressed="true"]{background:var(--y);color:#111}
.nav{display:flex;align-items:center;gap:8px;margin-left:auto}.nav b{min-width:170px;text-align:center;font-weight:700}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:17px}.arrow:hover{border-color:var(--y);color:var(--y)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.panel h2{font-size:24px;margin:0;line-height:1}.panel .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}.panel .ph p{margin:4px 0 0;color:var(--muted);font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}.state{padding:60px 20px;text-align:center;color:var(--muted)}
.units{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.units button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;color:var(--muted)}.units button b{color:var(--text);font-size:16px;margin-left:4px}.units button[aria-pressed=true]{border-color:var(--y)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}.col h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.kdot{width:10px;height:10px;border-radius:50%;flex:none}
.person{display:flex;align-items:center;gap:9px;padding:5px 0}.av{width:30px;height:30px;border-radius:50%;background:#262626;border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}.person b{display:block;font-size:13.5px;line-height:1.2}.person small{color:var(--muted);font-size:11.5px}
.off{margin-top:10px;font-size:13px;color:var(--muted)}
.chip{font-size:12px;border:1px solid var(--line2);border-radius:99px;padding:3px 11px;color:#d0d0d0;white-space:nowrap}
/* escala */
.gridw{overflow-x:auto;margin-top:6px}
table.esc{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:13px}
.esc th,.esc td{border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:middle}.esc th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}.esc th small{display:block;color:var(--text);font-size:14px;letter-spacing:0;text-transform:none;font-weight:700}.esc th.today{color:var(--y)}
.esc td.who{min-width:190px;position:sticky;left:0;background:var(--panel);z-index:1}.esc td.who .wh{display:flex;align-items:center;gap:9px}.esc td.who .av{width:34px;height:34px}.esc td.who b{display:block;font-size:13.5px;line-height:1.2}.esc td.who small{color:var(--muted);font-size:11.5px}
.esc td.tot{text-align:center;white-space:nowrap;font-size:12.5px;color:var(--muted);min-width:80px}.esc td.tot b{color:var(--text);display:block}.esc td.tot .warn{color:var(--warn);font-weight:700}
.cell{display:block;width:100%;min-height:44px;border-radius:9px;border:1px dashed #2f2f2f;color:#555;text-align:center;font-size:12px;padding:6px 4px;transition:border-color .2s}
.cell.ed:hover{border-color:var(--y);color:var(--y)}.cell.k{border-style:solid;color:#111;font-weight:700;line-height:1.2}.cell.k small{display:block;font-weight:600;opacity:.8;font-size:10.5px}
.cell.k.off{color:#ddd;background:#2a2a2a!important}.cell.k.off.ferias{background:#3a2430!important}.cell.k.off.ausente{background:#3c2424!important}
tr.cov td{background:var(--panel2);font-size:11.5px;text-align:center;color:var(--muted)}tr.cov td:first-child{text-align:left;font-weight:700;color:var(--text);position:sticky;left:0}.cov span{display:inline-block;margin:0 2px}.cov .z{color:var(--bad);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}
dialog{width:min(560px,calc(100% - 20px));max-height:calc(100dvh - 24px);border:1px solid #444;border-radius:18px;background:#121212;color:#f4f4f4;padding:0;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.fm{padding:20px 22px 22px}.fm h2{font-size:26px;margin:0 0 4px}.fm .help{margin:0 0 6px;color:var(--muted);font-size:13px}
.fm .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.fm .full{grid-column:1/-1}
.fm label.l{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.fm label.l small{font-size:11px;text-transform:none;letter-spacing:0;font-weight:500;color:#7d7d7d}
.inp{width:100%;background:#1c1c1c;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;text-transform:none;letter-spacing:0;font-weight:500}.inp:focus{border-color:var(--y)}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}.kinds button{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;font-size:13px;display:flex;align-items:center;gap:7px}.kinds button[aria-pressed=true]{border-color:var(--y);background:rgba(255,240,0,.08)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days button{border:1px solid var(--line2);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}.days button[aria-pressed=true]{border-color:var(--y);color:var(--y);background:rgba(255,240,0,.07)}
.fm .err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:18px}.fm .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b1b1b;border:1px solid rgba(255,240,0,.45);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:40;max-width:calc(100vw - 32px)}.toast.show{opacity:1;transform:translate(-50%,0)}
.pr-title{display:none}
@media (max-width:760px){.page{padding:16px 16px 70px}.nav{margin-left:0;width:100%;justify-content:space-between}.fm .row{grid-template-columns:1fr}}
@media print{
 html,body{background:#fff!important;color:#000!important}.page{padding:0;max-width:none}
 .hd,.bar,.units,.panel .ph button,.panel .ph .actions,.legend,.nav,.toast,.note-print-hide,.cell.ed:hover{display:none!important}
 .pr-title{display:block;font:700 18px Inter,sans-serif;margin:0 0 8px}
 .panel{border:0;background:#fff;padding:0;margin:0}.panel h2{color:#000;font-size:18px}.panel .ph p{color:#444}
 table.esc{min-width:0;font-size:11px}.esc th,.esc td{border-color:#999;color:#000}.esc td.who{position:static;background:#fff}.esc th small{color:#000}.esc td.who small,.esc td.tot,.esc td.tot b{color:#000}
 .cell{border-color:#bbb;color:#000}.cell:not(.k){color:transparent}.cell.k{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr.cov td,tr.cov td:first-child,tr.cov td small{background:#eee;color:#000!important}.esc th.today{color:#000}.panel h2,.panel .ph p{display:none!important}.panel .ph{margin:0}
}
.esc.mes{min-width:980px;font-size:11.5px}.esc.mes th,.esc.mes td{padding:3px 2px;text-align:center}.esc.mes th small{display:block;font-weight:600;font-size:11px;color:var(--text)}.esc.mes td.who{text-align:left;min-width:180px;padding:4px 8px}.esc.mes th:first-child{text-align:left}
.cell.mini{min-height:30px;min-width:26px;padding:3px 0;font-size:11px;border-radius:7px}.esc .we{background:rgba(255,255,255,.025)}.esc.mes tr.cov td{font-weight:700;color:var(--muted)}
@media print{.esc.mes{font-size:9px}.cell.mini{min-height:20px;min-width:0}@page{size:landscape}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body>
<div class="page" id="page"><div class="state">Carregando…</div></div>

<dialog id="sdlg" aria-labelledby="sTitle"><form class="fm" id="sform" novalidate>
 <h2 class="display" id="sTitle">Escalar</h2><p class="help" id="sHelp"></p>
 <div class="row"><div class="full"><label class="l" style="margin-bottom:6px">Turno</label><div class="kinds" id="s_kinds"></div></div></div>
 <div class="row" id="s_times"><label class="l">Entrada<small>Em branco = horário padrão</small><input class="inp" type="time" id="s_start"></label><label class="l">Saída<small>Em branco = horário padrão</small><input class="inp" type="time" id="s_end"></label></div>
 <div class="row"><label class="l full">Observação<small>Opcional. Ex.: cobre a Maria, curso, reunião</small><input class="inp" id="s_note" maxlength="120" autocomplete="off"></label></div>
 <div class="row"><div class="full"><label class="l" style="margin-bottom:6px">Aplicar também em <small>(mesmo turno e horário)</small></label><div class="days" id="s_days"></div></div></div>
 <p class="err" id="s_err" role="alert"></p>
 <div class="foot"><span><button type="button" class="btn-g danger" id="s_clear">Limpar</button></span><span style="display:flex;gap:8px"><button type="button" class="btn-g" data-close="sdlg">Cancelar</button><button type="submit" class="btn-y" id="s_save">Salvar</button></span></div>
</form></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
let CTX=null;try{CTX=(window.parent!==window&&window.parent.bohaCtx)||window.bohaCtx||null}catch{CTX=null}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UN={cb:'Casa Branca',te:'Santa Tereza',ma:'Macedônia'},TZ='America/Sao_Paulo';
const KINDS={manha:{l:'Manhã',c:'#ffd33d',t:['06:00','12:00'],h:6,work:true},tarde:{l:'Tarde',c:'#58a6ff',t:['12:00','18:00'],h:6,work:true},noite:{l:'Noite',c:'#a78bfa',t:['18:00','23:00'],h:5,work:true},integral:{l:'Dia todo',c:'#34d399',t:['08:00','17:00'],h:8,work:true},folga:{l:'Folga',c:'#555',work:false},ferias:{l:'Férias',c:'#d55181',work:false},ausente:{l:'Atestado / falta',c:'#e66767',work:false}};
const WORK=['manha','tarde','noite','integral'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],DOWF=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'],ORDER=[1,2,3,4,5,6,0];
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const dt=d=>new Date(d+'T12:00:00Z');
const addDays=(d,n)=>new Date(dt(d).getTime()+n*864e5).toISOString().slice(0,10);
const wd=d=>dt(d).getUTCDay();
const mondayOf=d=>addDays(d,-((wd(d)+6)%7));
const dm=d=>d.slice(8,10)+'/'+d.slice(5,7);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtLong=d=>cap(DOWF[wd(d)])+', '+(+d.slice(8,10))+' de '+MN[+d.slice(5,7)-1];
const hhmm=t=>t?String(t).slice(0,5):'';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3200)}

const LOCK=()=>CTX?.profile?.unit||null,MU=()=>{const l=CTX?.profile?.units||[];return l.length>1?l:[]},UNITS=()=>MU().length?MU():LOCK()?[LOCK()]:Object.keys(UN);
let PH={},EMPS=[],SHIFTS=[],S={tab:'hoje',unit:'cb',week:mondayOf(today()),month:today().slice(0,7)+'-01',func:''},editS=null,sKind='manha';
const canManage=()=>['admin','dono','gerente','marketing'].includes(CTX?.profile?.role);
const empsOf=u=>EMPS.filter(e=>e.unit===u).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
const fnText=e=>{const m=Array.isArray(e.modalities)&&e.modalities.length?' · '+e.modalities.join(', '):'';return (e.title||'')+m};
const fnKey=e=>((e.title||'').trim().toLowerCase())||'__sem';
const fnLabel=e=>((e.title||'').trim()||'Sem função').toLocaleUpperCase('pt-BR');
function funcsOf(u){const m=new Map();empsOf(u).forEach(e=>{const k=fnKey(e);if(!m.has(k))m.set(k,{k,l:fnLabel(e),n:0});m.get(k).n++});return [...m.values()].sort((a,b)=>(a.k==='__sem')-(b.k==='__sem')||a.l.localeCompare(b.l,'pt-BR'))}
const curFunc=u=>funcsOf(u).some(f=>f.k===S.func)?S.func:'';
const viewEmps=u=>{const f=curFunc(u);return f?empsOf(u).filter(e=>fnKey(e)===f):empsOf(u)};
const funcName=u=>{const f=funcsOf(u).find(x=>x.k===curFunc(u));return f?' · '+esc(f.l):''};
function funcBar(){const fs=funcsOf(S.unit);if(fs.length<2)return '';const f=curFunc(S.unit);
 return `<div class="funcbar" role="group" aria-label="Filtrar por função"><span class="fl">Função</span><button data-func="" aria-pressed="${!f}">Todas <b>${empsOf(S.unit).length}</b></button>${fs.map(x=>`<button data-func="${esc(x.k)}" aria-pressed="${f===x.k}">${esc(x.l)} <b>${x.n}</b></button>`).join('')}</div>`}
const shiftOf=(eid,d)=>SHIFTS.find(s=>s.employee_id===eid&&s.work_date===d);
const avatar=e=>`<span class="av">${PH[e.id]?`<img src="${PH[e.id]}" alt="" loading="lazy">`:esc(initials(e.name))}</span>`;
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function hours(s){
 if(!s||!KINDS[s.kind]?.work)return 0;
 if(s.start_time&&s.end_time){const [a,b]=[hhmm(s.start_time),hhmm(s.end_time)].map(x=>+x.slice(0,2)*60+ +x.slice(3,5));let m=b-a;if(m<=0)m+=1440;return m/60}
 return KINDS[s.kind].h;
}
const timeLabel=s=>s.start_time&&s.end_time?`${hhmm(s.start_time).replace(':00','h').replace(':','h')}–${hhmm(s.end_time).replace(':00','h').replace(':','h')}`:'';
/* ---------- cabeçalho ---------- */
function head(){
 const tabs=[['hoje','Hoje'],['escala','Escala da semana'],['mes','Escala do mês']];
 let nav='';
 if(S.tab==='escala'){const e=addDays(S.week,6);nav=`<div class="nav"><button class="arrow" data-wk="-1" aria-label="Semana anterior">‹</button><b>${+S.week.slice(8)} ${S.week.slice(5,7)!==e.slice(5,7)?MN[+S.week.slice(5,7)-1].slice(0,3)+' ':''}– ${+e.slice(8)} ${MN[+e.slice(5,7)-1].slice(0,3)} ${e.slice(0,4)}</b><button class="arrow" data-wk="1" aria-label="Próxima semana">›</button></div>`}
 if(S.tab==='mes'){nav=`<div class="nav"><button class="arrow" data-mo="-1" aria-label="Mês anterior">‹</button><b>${cap(MN[+S.month.slice(5,7)-1])} ${S.month.slice(0,4)}</b><button class="arrow" data-mo="1" aria-label="Próximo mês">›</button></div>`}
 return `<header class="hd"><p class="eyebrow">Equipe · dia a dia</p><h1 class="display">Escalas</h1><p class="sub">Quem trabalha em cada turno, as horas da semana e do mês e a cobertura de cada unidade. Dá para exportar em Excel.</p></header>
 <div class="bar"><div class="seg" role="tablist" aria-label="Seções">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join('')}</div>${UNITS().length>1?`<div class="seg" role="group" aria-label="Unidade">${UNITS().map(k=>`<button data-unit="${k}" aria-pressed="${S.unit===k}">${UN[k]}</button>`).join('')}</div>`:`<span class="chip" style="padding:7px 14px">${UN[UNITS()[0]]}</span>`}${nav}</div>${funcBar()}`;
}

/* ---------- hoje ---------- */
function tabHoje(){
 const d=today(),u=S.unit,emps=viewEmps(u),byKind=k=>emps.filter(e=>shiftOf(e.id,d)?.kind===k);
 const counts=UNITS().map(k=>({k,n:SHIFTS.filter(s=>s.work_date===d&&WORK.includes(s.kind)&&EMPS.find(e=>e.id===s.employee_id)?.unit===k).length}));
 const sched=emps.filter(e=>shiftOf(e.id,d)).length;
 const person=e=>{const s=shiftOf(e.id,d);return `<div class="person">${avatar(e)}<div><b>${esc(e.name)}</b><small>${esc(fnText(e))}${timeLabel(s)?(e.title?' · ':'')+timeLabel(s):''}${s.note?' · '+esc(s.note):''}</small></div></div>`};
 const cols=WORK.map(k=>{const l=byKind(k);return `<div class="col"><h3><i class="kdot" style="background:${KINDS[k].c}"></i>${KINDS[k].l} · ${l.length}</h3>${l.length?l.map(person).join(''):'<small style="color:var(--muted)">ninguém</small>'}</div>`}).join('');
 const off=['folga','ferias','ausente'].map(k=>[k,byKind(k)]).filter(x=>x[1].length).map(([k,l])=>`${KINDS[k].l}: ${l.map(e=>esc(e.name.split(' ')[0])).join(', ')}`).join(' · ');
 return `${counts.length>1?`<div class="units" role="group" aria-label="Quem trabalha hoje em cada unidade">${counts.map(c=>`<button data-unit="${c.k}" aria-pressed="${S.unit===c.k}">${UN[c.k]}<b>${c.n}</b> hoje</button>`).join('')}</div>`:''}
 <section class="panel"><div class="ph"><div><h2 class="display">Quem está hoje · ${UN[u]}${funcName(u)}</h2><p>${fmtLong(d)}</p></div></div>
 ${sched?`<div class="cols">${cols}</div>${off?`<p class="off">${off}</p>`:''}`:`<div class="empty">Ninguém escalado para hoje ${curFunc(u)?'nesta função':'nesta unidade'}.${canManage()?' <button class="btn-g" data-tab="escala" style="margin-left:6px">Montar a escala</button>':''}</div>`}</section>`;
}

/* ---------- escala ---------- */
function tabEscala(){
 const u=S.unit,emps=viewEmps(u),days=Array.from({length:7},(_,i)=>addDays(S.week,i)),t=today();
 if(!emps.length)return `<section class="panel"><div class="empty">Nenhum funcionário ativo em ${UN[u]}. Cadastre a equipe no Banco de funcionários.</div></section>`;
 const mg=canManage();
 const rows=emps.map(e=>{
  const tot=days.reduce((a,d)=>a+hours(shiftOf(e.id,d)),0),allWork=days.every(d=>KINDS[shiftOf(e.id,d)?.kind]?.work);
  return `<tr><td class="who"><div class="wh">${avatar(e)}<div><b>${esc(e.name)}</b><small>${esc(fnText(e))}</small></div></div></td>${days.map(d=>{const s=shiftOf(e.id,d),K=s&&KINDS[s.kind];
   return `<td><button class="cell ${mg?'ed':''} ${K?'k '+(K.work?'':'off '+s.kind):''}" ${mg?`data-cell="${e.id}|${d}"`:'disabled'} ${K&&K.work?`style="background:${K.c}"`:''} aria-label="${esc(e.name)}, ${DOW[wd(d)]} ${dm(d)}: ${K?K.l:'sem escala'}">${K?`${K.l}${timeLabel(s)?`<small>${timeLabel(s)}</small>`:''}${s.note?'<small>✎ '+esc(s.note.slice(0,18))+'</small>':''}`:(mg?'+':'')}</button></td>`}).join('')}<td class="tot"><b>${tot?tot.toLocaleString('pt-BR',{maximumFractionDigits:1})+'h':'—'}</b>${tot>44?'<span class="warn">⚠ acima de 44h</span>':allWork?'<span class="warn">⚠ sem folga</span>':''}</td></tr>`}).join('');
 const cov=days.map(d=>{const sh=emps.map(e=>shiftOf(e.id,d)?.kind),any=sh.some(k=>WORK.includes(k)),c=k=>sh.filter(x=>x===k||x==='integral').length,wk=wd(d)>=1&&wd(d)<=5;
  return `<td>${any?['manha','tarde','noite'].map(k=>{const n=c(k);return `<span class="${n===0&&wk?'z':''}" title="${KINDS[k].l}">${KINDS[k].l[0]}${n}</span>`}).join(''):'—'}</td>`}).join('');
 return `<section class="panel"><p class="pr-title">Escala · ${UN[u]}${funcName(u)} · ${dm(S.week)} a ${dm(addDays(S.week,6))}/${addDays(S.week,6).slice(0,4)}</p><div class="ph"><div><h2 class="display">Escala · ${UN[u]}${funcName(u)}</h2><p>${mg?'Toque numa célula para escalar. ':''}Sai o total de horas da semana por pessoa e a cobertura de cada dia.</p></div><div class="actions" style="display:flex;gap:8px;flex-wrap:wrap">${mg?'<button class="btn-g" data-copyprev>Copiar semana anterior</button>':''}<button class="btn-g" data-export="semana">Exportar Excel</button><button class="btn-g" data-print>Imprimir</button></div></div>
 <div class="gridw"><table class="esc"><thead><tr><th style="text-align:left">Funcionário</th>${days.map(d=>`<th class="${d===t?'today':''}">${DOW[wd(d)]}<small>${+d.slice(8)}</small></th>`).join('')}<th>Semana</th></tr></thead><tbody>${rows}<tr class="cov"><td>Cobertura${curFunc(u)?' da função':''}<br><small style="font-weight:400">M manhã · T tarde · N noite</small></td>${cov}<td></td></tr></tbody></table></div>
 <div class="legend">${Object.entries(KINDS).map(([k,v])=>`<span><i class="kdot" style="background:${v.c}"></i>${v.l}${v.t?' ('+v.t[0].slice(0,2)+'–'+v.t[1].slice(0,2)+'h)':''}</span>`).join('')}</div>
 <p class="note-print-hide" style="margin:10px 2px 0;color:var(--muted);font-size:12.5px">Os horários entre parênteses são o padrão do turno e só servem para somar as horas. Mude entrada e saída em cada célula quando for diferente. O aviso de 44h é um lembrete do limite semanal comum na CLT, não substitui a conferência do contador.</p></section>`;
}

/* ---------- mês ---------- */
const SHORT={manha:'M',tarde:'T',noite:'N',integral:'D',folga:'F',ferias:'FÉ',ausente:'A'};
const monthDays=m=>{const n=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).getUTCDate();return Array.from({length:n},(_,i)=>m.slice(0,8)+String(i+1).padStart(2,'0'))};
function tabMes(){
 const u=S.unit,emps=viewEmps(u),days=monthDays(S.month),t=today(),mg=canManage();
 if(!emps.length)return `<section class="panel"><div class="empty">Nenhum funcionário ativo em ${UN[u]}. Cadastre a equipe no Banco de funcionários.</div></section>`;
 const rows=emps.map(e=>{
  let h=0,dw=0,fo=0;
  const cells=days.map(d=>{const sh=shiftOf(e.id,d),K=sh&&KINDS[sh.kind];if(K&&K.work){h+=hours(sh);dw++}else if(sh&&sh.kind==='folga')fo++;
   return `<td class="${wd(d)===0||wd(d)===6?'we':''}"><button class="cell mini ${mg?'ed':''} ${K?'k '+(K.work?'':'off '+sh.kind):''}" ${mg?`data-cell="${e.id}|${d}"`:'disabled'} ${K&&K.work?`style="background:${K.c}"`:''} title="${esc(e.name)} · ${DOW[wd(d)]} ${dm(d)}: ${K?K.l+(timeLabel(sh)?' '+timeLabel(sh):''):'sem escala'}" aria-label="${esc(e.name)}, ${dm(d)}: ${K?K.l:'sem escala'}">${K?SHORT[sh.kind]:(mg?'·':'')}</button></td>`}).join('');
  return `<tr><td class="who"><div class="wh">${avatar(e)}<div><b>${esc(e.name)}</b><small>${esc(fnText(e))}</small></div></div></td>${cells}<td class="tot"><b>${h?h.toLocaleString('pt-BR',{maximumFractionDigits:1})+'h':'—'}</b><small>${dw} dia${dw===1?'':'s'} · ${fo} folga${fo===1?'':'s'}</small></td></tr>`;
 }).join('');
 const cov=days.map(d=>{const n=emps.filter(e=>WORK.includes(shiftOf(e.id,d)?.kind)).length;return `<td class="${wd(d)===0||wd(d)===6?'we':''}">${n||'·'}</td>`}).join('');
 return `<section class="panel"><p class="pr-title">Escala do mês · ${UN[u]}${funcName(u)} · ${cap(MN[+S.month.slice(5,7)-1])} ${S.month.slice(0,4)}</p><div class="ph"><div><h2 class="display">Escala do mês · ${UN[u]}${funcName(u)}</h2><p>${mg?'Toque numa célula para escalar. ':''}M manhã · T tarde · N noite · D dia todo · F folga · FÉ férias · A atestado/falta. Passe o mouse para ver o horário.</p></div><div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-g" data-export="mes">Exportar Excel</button><button class="btn-g" data-print>Imprimir</button></div></div>
 <div class="gridw"><table class="esc mes"><thead><tr><th style="text-align:left">Funcionário</th>${days.map(d=>`<th class="${d===t?'today':''} ${wd(d)===0||wd(d)===6?'we':''}">${DOW[wd(d)].slice(0,1)}<small>${+d.slice(8)}</small></th>`).join('')}<th>Mês</th></tr></thead><tbody>${rows}<tr class="cov"><td>Trabalham no dia<br><small style="font-weight:400">pessoas escaladas</small></td>${cov}<td></td></tr></tbody></table></div>
 <div class="legend">${Object.entries(KINDS).map(([k,v])=>`<span><i class="kdot" style="background:${v.c}"></i>${SHORT[k]} · ${v.l}</span>`).join('')}</div></section>`;
}
/* ---------- exportar (Excel) ---------- */
function shiftText(sh){const K=sh&&KINDS[sh.kind];if(!K)return '';return K.l+(K.work&&timeLabel(sh)?' '+timeLabel(sh):'')}
function exportData(kind){
 const u=S.unit,emps=viewEmps(u),days=kind==='mes'?monthDays(S.month):Array.from({length:7},(_,i)=>addDays(S.week,i));
 const period=kind==='mes'?cap(MN[+S.month.slice(5,7)-1])+' '+S.month.slice(0,4):dm(days[0])+' a '+dm(days[6])+'/'+days[6].slice(0,4);
 const head=['Funcionário','Função',...days.map(d=>DOW[wd(d)]+' '+dm(d)),'Horas','Dias trabalhados','Folgas'];
 const grid=[[`Escala · ${UN[u]}${S.func&&emps[0]?' · '+fnLabel(emps[0]):''} · ${period}`],[],head];
 const det=[['Funcionário','Função','Unidade','Data','Dia','Turno','Entrada','Saída','Horas','Observação']];
 emps.forEach(e=>{let h=0,dw=0,fo=0;
  const cells=days.map(d=>{const sh=shiftOf(e.id,d);if(sh){const K=KINDS[sh.kind];if(K&&K.work){h+=hours(sh);dw++}if(sh.kind==='folga')fo++;
    det.push([e.name,e.title||'',UN[u],d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4),DOW[wd(d)],K?K.l:sh.kind,hhmm(sh.start_time)||(K&&K.t?K.t[0]:''),hhmm(sh.end_time)||(K&&K.t?K.t[1]:''),K&&K.work?hours(sh):0,sh.note||''])}
   return shiftText(sh)});
  grid.push([e.name,fnText(e),...cells,Math.round(h*10)/10,dw,fo])});
 grid.push([]);grid.push(['Trabalham no dia','',...days.map(d=>emps.filter(e=>WORK.includes(shiftOf(e.id,d)?.kind)).length),'','','']);
 return {grid,det,name:`escala-${UN[u].toLowerCase().replace(/\s+/g,'-')}-${kind==='mes'?S.month.slice(0,7):'semana-'+days[0]}`};
}
function loadXlsx(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>window.XLSX?ok(window.XLSX):no();sc.onerror=no;document.head.appendChild(sc)})}
function saveBlob(blob,fname){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function toCsv(rows){return '\ufeff'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n')}
async function exportXlsx(kind){
 const d=exportData(kind);
 try{
  const X=await loadXlsx(),wb=X.utils.book_new(),ws=X.utils.aoa_to_sheet(d.grid),wd2=X.utils.aoa_to_sheet(d.det);
  ws['!cols']=[{wch:30},{wch:26},...d.grid[2].slice(2,-3).map(()=>({wch:kind==='mes'?10:16})),{wch:8},{wch:16},{wch:8}];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:Math.min(8,d.grid[2].length-1)}}];
  wd2['!cols']=[{wch:30},{wch:26},{wch:14},{wch:12},{wch:6},{wch:16},{wch:8},{wch:8},{wch:7},{wch:32}];
  X.utils.book_append_sheet(wb,ws,kind==='mes'?'Mês':'Semana');X.utils.book_append_sheet(wb,wd2,'Detalhes');
  X.writeFile(wb,d.name+'.xlsx');toast('Planilha Excel gerada.');
 }catch(e){
  saveBlob(new Blob([toCsv(d.grid)],{type:'text/csv;charset=utf-8'}),d.name+'.csv');toast('Não foi possível gerar o .xlsx agora; baixei em CSV, que o Excel também abre.');
 }
}
function render(){$('page').innerHTML=head()+(S.tab==='hoje'?tabHoje():S.tab==='mes'?tabMes():tabEscala())}

/* ---------- escala: diálogo ---------- */
function openShift(eid,d){
 const e=EMPS.find(x=>x.id===eid),s=shiftOf(eid,d);editS={eid,d};sKind=s?.kind||'manha';
 $('sTitle').textContent=e.name;$('sHelp').textContent=`${cap(DOWF[wd(d)])}, ${dm(d)}`+(s?' · editando turno existente':'');
 $('s_start').value=hhmm(s?.start_time);$('s_end').value=hhmm(s?.end_time);$('s_note').value=s?.note||'';$('s_err').textContent='';
 const week=Array.from({length:7},(_,i)=>addDays(S.week,i)).filter(x=>x!==d);
 $('s_days').innerHTML=week.map(x=>`<button type="button" data-sday="${x}" aria-pressed="false">${DOW[wd(x)]} ${+x.slice(8)}</button>`).join('');
 drawKinds();$('s_clear').hidden=!s;$('sdlg').showModal();
}
function drawKinds(){
 $('s_kinds').innerHTML=Object.entries(KINDS).map(([k,v])=>`<button type="button" data-skind="${k}" aria-pressed="${sKind===k}"><i class="kdot" style="background:${v.c}"></i>${v.l}</button>`).join('');
 $('s_times').hidden=!KINDS[sKind].work;
 $('s_start').placeholder=KINDS[sKind].t?KINDS[sKind].t[0]:'';
}
$('sform').addEventListener('submit',async e=>{
 e.preventDefault();const err=t=>{$('s_err').textContent=t};if(!editS)return;
 const w=KINDS[sKind].work,st=w?$('s_start').value:'',en=w?$('s_end').value:'';
 if((st&&!en)||(!st&&en))return err('Preencha entrada e saída, ou deixe as duas em branco.');
 const dates=[editS.d,...[...$('s_days').querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.sday)];
 const rows=dates.map(d=>({employee_id:editS.eid,work_date:d,kind:sKind,start_time:st||null,end_time:en||null,note:$('s_note').value.trim().slice(0,120)}));
 const b=$('s_save');b.disabled=true;
 const {data,error}=await CTX.client.from('boha_shifts').upsert(rows,{onConflict:'employee_id,work_date'}).select();
 b.disabled=false;if(error)return err('Não foi possível salvar. Tente de novo.');
 SHIFTS=SHIFTS.filter(s=>!(s.employee_id===editS.eid&&dates.includes(s.work_date)));SHIFTS.push(...(data||rows));
 $('sdlg').close();render();toast(dates.length>1?`Turno salvo em ${dates.length} dias.`:'Turno salvo.');
});
$('s_clear').addEventListener('click',async()=>{
 if(!editS)return;const dates=[editS.d,...[...$('s_days').querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.sday)];
 const {error}=await CTX.client.from('boha_shifts').delete().eq('employee_id',editS.eid).in('work_date',dates);
 if(error){$('s_err').textContent='Não foi possível limpar.';return}
 SHIFTS=SHIFTS.filter(s=>!(s.employee_id===editS.eid&&dates.includes(s.work_date)));$('sdlg').close();render();toast('Turno removido.');
});
async function copyPrev(){
 const u=S.unit,ids=new Set(empsOf(u).map(e=>e.id)),prev=addDays(S.week,-7),src=SHIFTS.filter(s=>ids.has(s.employee_id)&&s.work_date>=prev&&s.work_date<S.week);
 if(!src.length){toast('A semana anterior não tem escala para copiar.');return}
 const rows=src.map(s=>({employee_id:s.employee_id,work_date:addDays(s.work_date,7),kind:s.kind,start_time:s.start_time,end_time:s.end_time,note:s.note})).filter(r=>!shiftOf(r.employee_id,r.work_date));
 if(!rows.length){toast('A semana atual já está preenchida.');return}
 const {data,error}=await CTX.client.from('boha_shifts').insert(rows).select();if(error){toast('Não foi possível copiar a semana.');return}
 SHIFTS.push(...(data||rows));render();toast(`${rows.length} turno${rows.length===1?'':'s'} copiado${rows.length===1?'':'s'} da semana anterior.`);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const t=e.target;let b;
 if(b=t.closest('[data-close]')){$(b.dataset.close).close();return}
 if(b=t.closest('[data-tab]')){S.tab=b.dataset.tab;render();return}
 if(b=t.closest('[data-unit]')){S.unit=b.dataset.unit;render();return}
 if(b=t.closest('[data-func]')){S.func=b.dataset.func;render();return}
 if(b=t.closest('[data-export]')){exportXlsx(b.dataset.export);return}
 if(b=t.closest('[data-mo]')){const y=+S.month.slice(0,4),m=+S.month.slice(5,7)-1+ +b.dataset.mo,d=new Date(Date.UTC(y,m,1));S.month=d.toISOString().slice(0,7)+'-01';load().catch(()=>render());return}
 if(b=t.closest('[data-wk]')){S.week=addDays(S.week,7*+b.dataset.wk);render();return}
 if(b=t.closest('[data-cell]')){const [eid,d]=b.dataset.cell.split('|');openShift(eid,d);return}
 if(b=t.closest('[data-skind]')){sKind=b.dataset.skind;drawKinds();return}
 if(b=t.closest('[data-sday]')){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');return}
 if(t.closest('[data-copyprev]')){copyPrev();return}
 if(t.closest('[data-print]')){window.print();return}
});
['sdlg'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).close()}));

let LOADED_FROM=null;
async function fetchShifts(c,from,to){
 let all=[];for(let i=0;i<20;i++){const r=await c.from('boha_shifts').select('*').gte('work_date',from).lte('work_date',to).order('work_date').range(i*1000,i*1000+999);if(r.error)throw r.error;all=all.concat(r.data||[]);if((r.data||[]).length<1000)break}
 return all;
}
async function load(){
 const c=CTX.client,from=[addDays(today(),-70),S.month].sort()[0],mEnd=monthDays(S.month).slice(-1)[0],to=[addDays(today(),200),mEnd].sort().slice(-1)[0];
 const [emps,sh]=await Promise.all([CTX.loadEmployees?CTX.loadEmployees():Promise.resolve([]),fetchShifts(c,from,to)]);
 EMPS=emps||[];SHIFTS=sh;LOADED_FROM=from;render();
 if(CTX.loadEmployeePhotos&&!load.ph){load.ph=true;CTX.loadEmployeePhotos().then(m=>{PH=m||{};render()}).catch(()=>{load.ph=false})}
}
window.bohaReload=()=>{if(!document.querySelector('dialog[open]'))load().catch(()=>{})};
(async()=>{
 if(!CTX||!CTX.client){$('page').innerHTML='<div class="state">Abra este módulo pelo <a href="../equipe.html#escalas" style="color:var(--y)">sistema interno da Boha</a>.</div>';return}
 if(CTX.canModule&&!CTX.canModule('escalas')){$('page').innerHTML='<div class="state">Este módulo não está liberado para o seu perfil.</div>';return}
 S.unit=LOCK()||'cb';
 try{await load()}catch{$('page').innerHTML='<div class="state">Não foi possível carregar os dados. Atualize a página.</div>'}
})();
</script></body></html>
