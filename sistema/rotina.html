<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOHA · Rotina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1a1a19;--line:#242424;--line2:#333;--text:#f2f2f2;--muted:#9b9b9b;--y:#fff000;--good:#3ddc84;--bad:#ff5a4f;--warn:#ff9f2e;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
[hidden]{display:none!important}
.display{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.3px}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0;color:var(--y);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--y)}
.btn-y{background:var(--y);color:#111;font-weight:800;border-radius:10px;padding:10px 16px;font-size:14px;white-space:nowrap;text-align:center}.btn-y:disabled{opacity:.5;cursor:wait}
.btn-g{border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap;text-align:center;transition:border-color .2s,color .2s}
.btn-g:hover{border-color:var(--y);color:var(--y)}.btn-g.danger:hover{border-color:var(--bad);color:var(--bad)}
.page{max-width:1280px;margin:0 auto;padding:22px 28px 80px}
.hd h1{font-size:clamp(34px,5vw,60px);line-height:1;margin:12px 0 6px}.hd p.sub{margin:0;color:var(--muted);font-size:14px;max-width:580px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.seg{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto;scrollbar-width:none;max-width:100%}.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}.seg button:hover{color:var(--text)}.seg button[aria-pressed="true"]{background:var(--y);color:#111}
.nav{display:flex;align-items:center;gap:8px;margin-left:auto}.nav b{min-width:170px;text-align:center;font-weight:700}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:17px}.arrow:hover{border-color:var(--y);color:var(--y)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.panel h2{font-size:24px;margin:0;line-height:1}.panel .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}.panel .ph p{margin:4px 0 0;color:var(--muted);font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}.state{padding:60px 20px;text-align:center;color:var(--muted)}
.units{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.units button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;color:var(--muted)}.units button b{color:var(--text);font-size:16px;margin-left:4px}.units button[aria-pressed=true]{border-color:var(--y)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}.col h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.kdot{width:10px;height:10px;border-radius:50%;flex:none}
.person{display:flex;align-items:center;gap:9px;padding:5px 0}.av{width:30px;height:30px;border-radius:50%;background:#262626;border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}.person b{display:block;font-size:13.5px;line-height:1.2}.person small{color:var(--muted);font-size:11.5px}
.off{margin-top:10px;font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid var(--line2);border-radius:99px;padding:3px 11px;color:#d0d0d0;white-space:nowrap}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.chips2 button{border:1px solid var(--line2);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}.chips2 button[aria-pressed=true]{border-color:var(--y);color:var(--y);background:rgba(255,240,0,.07)}
.prog{height:8px;background:#222;border-radius:99px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:var(--y);border-radius:99px;transition:width .5s var(--ease)}.prog i.ok{background:var(--good)}
.mom{margin-top:14px}.mom h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--y)}
.item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-top:6px}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--y);flex:none}.item .tt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.item.done .tt{text-decoration:line-through;color:var(--muted)}.item small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.item .edit{border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}.item .edit:hover{border-color:var(--y);color:var(--y)}
.week{display:flex;gap:8px;align-items:flex-end;margin-top:6px}.wk{flex:1;text-align:center;font-size:11px;color:var(--muted)}.wk .b{height:64px;background:#1b1b1b;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:5px}.wk .b i{display:block;width:100%;border-radius:8px 8px 0 0}.wk b{display:block;color:var(--text);font-size:12px}
dialog{width:min(560px,calc(100% - 20px));max-height:calc(100dvh - 24px);border:1px solid #444;border-radius:18px;background:#121212;color:#f4f4f4;padding:0;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.fm{padding:20px 22px 22px}.fm h2{font-size:26px;margin:0 0 4px}.fm .help{margin:0 0 6px;color:var(--muted);font-size:13px}
.fm .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.fm .full{grid-column:1/-1}
.fm label.l{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.fm label.l small{font-size:11px;text-transform:none;letter-spacing:0;font-weight:500;color:#7d7d7d}
.inp{width:100%;background:#1c1c1c;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;text-transform:none;letter-spacing:0;font-weight:500}.inp:focus{border-color:var(--y)}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}.kinds button{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;font-size:13px;display:flex;align-items:center;gap:7px}.kinds button[aria-pressed=true]{border-color:var(--y);background:rgba(255,240,0,.08)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days button{border:1px solid var(--line2);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}.days button[aria-pressed=true]{border-color:var(--y);color:var(--y);background:rgba(255,240,0,.07)}
.fm .err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:18px}.fm .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b1b1b;border:1px solid rgba(255,240,0,.45);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);z-index:40;max-width:calc(100vw - 32px)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.page{padding:16px 16px 70px}.nav{margin-left:0;width:100%;justify-content:space-between}.fm .row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* painel do gerente */
.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-left:auto}.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpi span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.kpi b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;line-height:1.1;margin-top:4px}.kpi small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--good)}.kpi.warn b{color:var(--warn)}
.moms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}.mc h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.mc .n{font-size:22px;font-weight:800;margin:4px 0 6px}.mc .n small{font-size:13px;color:var(--muted);font-weight:600}.mc .st{font-size:12px;font-weight:700;margin-top:6px}.mc .dl{font-size:11.5px;color:var(--muted)}
.st.ok{color:var(--good)}.st.late{color:var(--bad)}.st.run{color:var(--y)}.st.wait{color:var(--muted)}
.prog.bad i{background:var(--bad)}.prog.warn i{background:var(--warn)}
.item .tag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 9px;white-space:nowrap}.tag.late{background:rgba(255,90,79,.14);color:var(--bad)}.tag.ok{background:rgba(61,220,132,.12);color:var(--good)}
.item .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800}.item .dot.ok{background:var(--good);border-color:var(--good);color:#111}.item .dot.late{border-color:var(--bad)}
.who{display:grid;gap:8px}.who .r{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:13px}.who .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who .r i{display:block;height:9px;border-radius:99px;background:var(--y)}.who .r b{text-align:right}
.week.long{gap:5px;overflow-x:auto;padding-bottom:4px}.week.long .wk{font-size:10.5px;flex:1 0 38px}.week.long .wk .b{height:90px}
@media (max-width:760px){.live{margin-left:0}.who .r{grid-template-columns:90px 1fr 30px}.week.long .wk{font-size:9.5px}}

/* checklist da recepção por blocos */
.blk .bn{margin:0 0 2px;color:var(--y);font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.blk .bcount{font-family:Anton,Impact,sans-serif;font-size:22px;color:var(--muted)}.blk .bcount.ok{color:var(--good)}
.blk .intro{margin:0 0 8px;color:#cfcfcf;font-size:13.5px}
.item .tt small.hint{display:block;color:var(--muted);font-size:12px;margin-top:1px}
details.orient{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:0}
details.orient summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:700;color:var(--y);list-style:none}details.orient summary::-webkit-details-marker{display:none}details.orient summary::after{content:' ▾';color:var(--muted)}
details.orient[open] summary::after{content:' ▴'}
details.orient .ob{padding:0 14px 12px;font-size:13.5px;color:#d6d6d6}details.orient .ob p{margin:0 0 6px}details.orient .ob ul{margin:4px 0 0;padding-left:18px}
.ho{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.ho h3{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--y)}.ho p.sm{margin:0 0 8px;color:var(--muted);font-size:12.5px}
.ho label{display:grid;gap:3px;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}.ho textarea{width:100%;min-height:54px;resize:vertical;background:#1c1c1c;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:14px;outline:none;font-weight:500;color:var(--text)}.ho textarea:focus{border-color:var(--y)}
.ho .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.ho .row2 small{color:var(--muted)}
.prev{border-color:rgba(255,240,0,.35)}.prev dl{margin:0;display:grid;gap:6px}.prev dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.prev dd{margin:0 0 4px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
/* painel do gerente por pessoa */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px}
.pcard .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pcard .av2{width:42px;height:42px;border-radius:50%;background:#262626;border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;flex:none}
.pcard .who2{flex:1;min-width:150px}.pcard .who2 b{display:block;font-size:16px}.pcard .who2 small{color:var(--muted);font-size:12.5px}
.pcard .num{font-family:Anton,Impact,sans-serif;font-size:26px;line-height:1}.pcard .num small{font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);font-weight:600;margin-left:4px}
.stt{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:3px 10px;white-space:nowrap}.stt.ok{background:rgba(61,220,132,.12);color:var(--good)}.stt.run{background:rgba(255,240,0,.1);color:var(--y)}.stt.wait{background:#242424;color:var(--muted)}
.bl6{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}.bl6 div{font-size:11.5px;color:var(--muted)}.bl6 b{display:block;color:var(--text);font-size:12.5px;margin-top:3px}.bl6 .prog{margin:5px 0 0;height:6px}
details.pd{margin-top:12px}details.pd summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--y)}
details.pd .mom{margin-top:10px}
@media (max-width:760px){.bl6{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* dias anteriores, histórico e anotações */
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.daynav .arrow:disabled{opacity:.3;cursor:default}.daynav .arrow:disabled:hover{border-color:var(--line2);color:inherit}
.dpick{position:relative;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:12px;padding:6px 8px 6px 14px;font-weight:700;background:var(--panel);min-height:38px;font-size:14px}
.dpick input{background:#1c1c1c;border:1px solid var(--line2);border-radius:8px;color:var(--text);font:inherit;font-size:13px;padding:4px 7px;color-scheme:dark}
.daynav .hint2{color:var(--muted);font-size:12px}
.pastflag{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);border-radius:99px;padding:3px 11px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px;max-width:100%}
table.hist{border-collapse:collapse;width:100%;font-size:13px}
.hist th,.hist td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.hist tr:last-child td{border-bottom:0}
.hist th{background:#171717;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hist td:first-child,.hist th:first-child{text-align:left;position:sticky;left:0;background:#141414;z-index:1;font-weight:700}
.hist tr[data-day]{cursor:pointer}.hist tr[data-day]:hover td{background:#1c1c1c}.hist tr.sel td{background:rgba(255,240,0,.09)}
.hist td small{display:block;font-size:11px;opacity:.85;font-weight:500}
.hist td.g{color:var(--good)}.hist td.w{color:var(--warn)}.hist td.b{color:var(--bad)}.hist td.na{color:#555}
.hist td i{font-style:normal;font-size:11px;margin-left:3px}
.wk[data-day]{cursor:pointer}.wk[data-day]:hover .b{outline:1px solid var(--y)}.wk.cur b{color:var(--y)}
.notes{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.notes h3{margin:0 0 2px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--y)}.notes p.sm{margin:4px 0 8px;color:var(--muted);font-size:12.5px}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:10px;padding:8px 11px;margin-top:7px}.note.recepcao{border-left-color:#6aa9ff}
.note .nh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}.note .nh b{color:var(--text)}.note .nh .x{margin-left:auto;color:var(--muted);padding:2px 7px;border-radius:6px}.note .nh .x:hover{color:var(--bad)}
.note p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.notes textarea{width:100%;min-height:60px;resize:vertical;background:#1c1c1c;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:14px;outline:none;margin-top:8px}.notes textarea:focus{border-color:var(--y)}
.notes .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}.notes .row2 small{color:var(--muted)}
.pfoot{display:flex;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
@media (max-width:760px){.daynav .hint2{width:100%}}
</style></head><body>
<div class="page" id="page"><div class="state">Carregando…</div></div>

<dialog id="rdlg" aria-labelledby="rTitle"><form class="fm" id="rform" novalidate>
 <h2 class="display" id="rTitle">Nova tarefa</h2><p class="help">Uma tarefa que toda recepcionista da unidade passa a ter no checklist do dia.</p>
 <div class="row"><label class="l full">Tarefa<input class="inp" id="r_title" maxlength="160" autocomplete="off" placeholder="Ex.: Conferir a limpeza do salão"></label></div>
 <div class="row"><label class="l full">Critério ou orientação <small>Opcional. Aparece em letra pequena abaixo da tarefa</small><input class="inp" id="r_hint" maxlength="300" autocomplete="off"></label></div>
 <div class="row"><label class="l">Bloco<select class="inp" id="r_block"></select></label><label class="l">Situação<select class="inp" id="r_active"><option value="1">Ativa</option><option value="0">Pausada</option></select></label></div>
 <div class="row" id="r_unitrow"><label class="l full">Unidade<select class="inp" id="r_unit"></select></label></div>
 <div class="row"><div class="full"><label class="l" style="margin-bottom:6px">Dias da semana <small>(todos marcados = todo dia)</small></label><div class="days" id="r_days"></div></div></div>
 <p class="err" id="r_err" role="alert"></p>
 <div class="foot"><span><button type="button" class="btn-g danger" id="r_del" hidden>Excluir</button></span><span style="display:flex;gap:8px"><button type="button" class="btn-g" data-close="rdlg">Cancelar</button><button type="submit" class="btn-y">Salvar</button></span></div>
</form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
let CTX=null;try{CTX=(window.parent!==window&&window.parent.bohaCtx)||window.bohaCtx||null}catch{CTX=null}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UN={cb:'Casa Branca',te:'Santa Tereza',ma:'Macedônia'},TZ='America/Sao_Paulo';
const ROLE='Recepção';
const BLOCKS=[
 {k:'abertura',n:1,t:'Abertura do expediente',short:'Abertura',s:'Diário · Início do turno',note:{label:'Instrução',text:'Comece vendo se a recepção está pronta para receber alunos e interessados. Não deixe pendência do turno anterior sem acompanhamento.'}},
 {k:'atendimento',n:2,t:'Atendimento',short:'Atendimento',s:'Diário · Durante todo o expediente',note:{label:'Padrão esperado',text:'Nenhum cliente fica sem atendimento ou orientação. O que não puder ser resolvido na hora é registrado e encaminhado.'}},

function personDay(email,u,d){const a=applicable(d,u),mine=a.filter(r=>checkOf(r.id,d,email));const last=mine.map(r=>checkOf(r.id,d,email)).sort((x,y)=>y.done_at.localeCompare(x.done_at))[0];return {t:a.length,n:mine.length,last}}

function histTable(u,sel){

 const st={};ps.forEach(p=>{st[p.email]=start(p.email)});

 for(let i=0;i<S.hist;i++){
  const x=addDays(today(),-i),t=applicable(x,u).length;let sum=0,cnt=0;

}

}
$('rform').addEventListener('submit',async e=>{
 e.preventDefault();const err=t=>{$('r_err').textContent=t};const title=$('r_title').value.trim();if(!title)return err('Escreva a tarefa.');
 const days=[...$('r_days').querySelectorAll('[aria-pressed="true"]')].map(b=>+b.dataset.rday);if(!days.length)return err('Marque ao menos um dia da semana.');
 const row={title,hint:$('r_hint').value.trim()||null,role_name:ROLE,block:$('r_block').value,moment:null,unit:MU().length?$('r_unit').value:(LOCK()||$('r_unit').value||null),active:$('r_active').value==='1',weekdays:days.length===7?null:days};
 const out=editR?await CTX.client.from('boha_routines').update(row).eq('id',editR.id).select().single():await CTX.client.from('boha_routines').insert({...row,sort:Math.max(0,...ROUTINES.map(x=>x.sort))+1}).select().single();
 if(out.error)return err('Não foi possível salvar.');
 if(editR)ROUTINES=ROUTINES.map(x=>x.id===editR.id?out.data:x);else ROUTINES.push(out.data);$('rdlg').close();render();toast('Tarefa salva.');
});
$('r_del').addEventListener('click',async()=>{
 if(!editR||!confirm('Excluir esta tarefa? O histórico de quem marcou também some.'))return;const {error}=await CTX.client.from('boha_routines').delete().eq('id',editR.id);
 if(error){$('r_err').textContent='Não foi possível excluir.';return}const id=editR.id;ROUTINES=ROUTINES.filter(x=>x.id!==id);CHECKS=CHECKS.filter(c=>c.routine_id!==id);rebuild();$('rdlg').close();render();toast('Tarefa excluída.');
});
async function useTemplate(){
 const {data,error}=await CTX.client.rpc('boha_reception_template_apply',{p_unit:S.unit});
 if(error){toast('Não foi possível aplicar o modelo.');return}
 if(!data){toast('Esta unidade já tem o modelo aplicado.');return}
 await load();toast('Modelo completo aplicado em '+UN[S.unit]+'.');
}

/* ---------- marcar (recepção) ---------- */
async function toggleCheck(rid,on){
 const u=S.unit,d=today(),me=ME();
 if(on){const {data,error}=await CTX.client.from('boha_routine_checks').insert({routine_id:rid,unit:u,check_date:d,done_by_name:(CTX.profile?.name||'').slice(0,80)}).select().single();if(error&&!/duplicate|23505/i.test(error.message||'')){toast('Não foi possível marcar.');render();return}if(data)CHECKS.push(data)}
 else{const {error}=await CTX.client.from('boha_routine_checks').delete().eq('routine_id',rid).eq('check_date',d).eq('done_by',me);if(error){toast('Não foi possível desmarcar.');render();return}CHECKS=CHECKS.filter(c=>!(c.routine_id===rid&&c.check_date===d&&c.done_by===me))}
 rebuild();render();
}
/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const t=e.target;let b;
 if(b=t.closest('[data-close]')){$(b.dataset.close).close();return}
 if(b=t.closest('[data-tab]')){S.tab=b.dataset.tab;render();return}
 if(b=t.closest('[data-unit]')){if(UNITS().includes(b.dataset.unit)){S.unit=b.dataset.unit;render()}return}
 if(b=t.closest('[data-rday]')){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');return}
 if(b=t.closest('[data-day-step]')){setDay(addDays(S.day||today(),+b.dataset.dayStep));return}
 if(t.closest('[data-day-today]')){setDay(today());return}
 if(b=t.closest('[data-day]')){setDay(b.dataset.day);window.scrollTo({top:0,behavior:'smooth'});return}
 if(b=t.closest('[data-hist]')){S.hist=+b.dataset.hist;render(true);return}
 if(b=t.closest('[data-note-add]')){noteAdd(b);return}
 if(b=t.closest('[data-note-del]')){noteDel(b.dataset.noteDel);return}
 if(b=t.closest('[data-rm]')){removePerson(b.dataset.rm,b.dataset.rmName);return}
 if(t.closest('[data-newr]')){openRoutine(null);return}
 if(b=t.closest('[data-redit]')){openRoutine(ROUTINES.find(x=>x.id===b.dataset.redit));return}
 if(t.closest('[data-template]')){useTemplate();return}
});
const setDay=x=>{const t0=today();if(x>t0)x=t0;if(x<MINDAY())x=MINDAY();S.day=x===t0?null:x;render(true)};
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chk)toggleCheck(t.dataset.chk,t.checked);else if(t.id==='dayIn'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value))setDay(t.value)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.noteIn!==undefined)DRAFT[t.dataset.noteIn]=t.value});
document.addEventListener('keydown',e=>{const w=e.target.closest&&e.target.closest('.wk[data-day]');if(w&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setDay(w.dataset.day)}});
async function noteAdd(b){
 const email=b.dataset.noteAdd,day=b.dataset.noteDay,mode=b.dataset.noteMode,key=email+'|'+day+'|'+mode,ta=document.querySelector('[data-note-in="'+CSS.escape(key)+'"]'),body=(ta?ta.value:DRAFT[key]||'').trim();
 if(!body){toast('Escreva a anotação antes de salvar.');return}
 b.disabled=true;
 const {error}=await CTX.client.rpc('boha_rnote_add',{p_person:email,p_date:day,p_body:body});
 b.disabled=false;
 if(error){toast(/hoje|futuro|inválida|Data/i.test(error.message||'')?error.message:'Não foi possível salvar a anotação.');return}
 DRAFT[key]='';await load(true);toast('Anotação salva.');
}
async function noteDel(id){
 if(!confirm('Excluir esta anotação?'))return;
 const {error}=await CTX.client.rpc('boha_rnote_delete',{p_id:id});
 if(error){toast('Você só pode excluir as suas próprias anotações.');return}
 NOTES=NOTES.filter(n=>n.id!==id);render(true);toast('Anotação excluída.');
}
async function removePerson(email,name){
 if(!confirm('Excluir '+name+' da recepção?\n\nA pessoa perde o acesso ao sistema e some deste painel. O histórico de marcações dela continua guardado.\n\nPara voltar, o administrador precisa criar o acesso de novo em Gestão de acessos.'))return;
 const {error}=await CTX.client.rpc('boha_reception_remove',{p_email:email});
 if(error){toast('Não foi possível excluir. Você só pode excluir recepcionistas da sua unidade.');return}
 await load(true);toast(name+' foi excluída da recepção.');
}
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.open){if(d.open)OPEN.add(d.dataset.open);else OPEN.delete(d.dataset.open)}},true);
$('rdlg').addEventListener('click',e=>{if(e.target===$('rdlg'))$('rdlg').close()});

async function load(force){
 const c=CTX.client,cfrom=addDays(today(),-60),mg=canManage();
 const [ro,ch,tm2,nt]=await Promise.all([c.from('boha_routines').select('*').order('sort').limit(2000),c.from('boha_routine_checks').select('*').gte('check_date',cfrom).limit(20000),mg?c.rpc('boha_reception_team'):Promise.resolve({data:[]}),c.from('boha_routine_notes').select('*').gte('note_date',cfrom).order('created_at').limit(5000)]);
 if(ro.error)throw ro.error;ROUTINES=ro.data||[];if(!ch.error){CHECKS=ch.data||[]}if(!tm2.error)TEAM=(tm2.data||[]).map(p=>({...p,email:String(p.email).toLowerCase()}));
 if(!nt.error)NOTES=nt.data||[];
 rebuild();updated=new Date().toISOString();render(force);
}
function startLive(){clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState==='visible'&&!document.querySelector('dialog[open]'))load().catch(()=>{})},30000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CTX&&CTX.client)load().catch(()=>{})});
window.bohaReload=()=>{if(!document.querySelector('dialog[open]'))load().catch(()=>{})};
(async()=>{
 if(!CTX||!CTX.client){$('page').innerHTML='<div class="state">Abra este módulo pelo <a href="../equipe.html#rotina" style="color:var(--y)">sistema interno da Boha</a>.</div>';return}
 if(CTX.canModule&&!CTX.canModule('rotina')){$('page').innerHTML='<div class="state">Este módulo não está liberado para o seu perfil.</div>';return}
 S.unit=LOCK()||'cb';
 try{await load();startLive()}catch{$('page').innerHTML='<div class="state">Não foi possível carregar os dados. Atualize a página.</div>'}
})();
</script></body></html>
